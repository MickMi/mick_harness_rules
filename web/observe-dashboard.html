<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mick Harness · 项目导航</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f6f7f9, #111317);
      --surface: light-dark(#ffffff, #191c22);
      --surface-2: light-dark(#eef1f5, #232730);
      --text: light-dark(#17191d, #f1f3f5);
      --muted: light-dark(#616977, #a9b0bd);
      --border: light-dark(#d9dee7, #353b47);
      --accent: light-dark(#2457d6, #89a9ff);
      --accent-soft: light-dark(#e7edff, #24335d);
      --danger: light-dark(#b3261e, #ffaaa4);
      --warning: light-dark(#8a5800, #ffd089);
      --success: light-dark(#1c6b3c, #88d3a6);
      --surface-soft: light-dark(#f5f7fa, #1e222a);
      --danger-soft: light-dark(#fdecec, #3a2626);
      --warning-soft: light-dark(#fdf3e0, #3a2f1a);
      --success-soft: light-dark(#e9f6ee, #1f3327);
      --code-bg: light-dark(#111827, #0b0d11);
      --code-fg: #e7eaf0;
      --code-header-bg: #181d27;
      --code-header-fg: #c8d2e4;
      --code-gutter-fg: #667085;
      --code-gutter-bg: #111827;
      --fs-page-title: 30px;
      --fs-section-title: 19px;
      --fs-body: 15px;
      --fs-caption: 12.5px;
      --fs-mono: 12px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 22px 16px; }
    .brand { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .nav-tree { display: grid; gap: 2px; }
    .nav-project, .nav-view {
      width: 100%; text-align: left; border: 0; border-radius: 8px;
      background: transparent; color: inherit; cursor: pointer; font: inherit;
    }
    .nav-section-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 14px 10px 5px; padding-top: 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .nav-section-label .nav-count { font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .nav-project { padding: 8px 10px; display: grid; gap: 3px; margin-top: 2px; }
    .nav-project:hover { background: var(--surface-2); }
    .nav-project[aria-current="true"] { background: var(--accent-soft); }
    .nav-project-head { display: flex; gap: 6px; align-items: center; }
    .nav-expander { width: 14px; color: var(--muted); font-size: 11px; flex: none; }
    .nav-name { font-weight: 600; overflow-wrap: anywhere; }
    .nav-project[data-validation]:not([data-validation="valid"]) .nav-name { color: var(--danger); }
    .nav-meta { display: flex; gap: 8px; padding-left: 20px; color: var(--muted); font-size: 12px; }
    .nav-views { display: grid; gap: 1px; margin: 2px 0 8px 22px; padding-left: 8px; border-left: 1px solid var(--border); }
    .nav-view { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 6px 8px; color: var(--muted); }
    .nav-view:hover { background: var(--surface-2); color: var(--text); }
    .nav-view[aria-current="true"] { color: var(--text); font-weight: 650; background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-badge { color: var(--danger); font-size: 11px; font-weight: 650; }
    .nav-more { margin: 2px 0 8px 22px; padding-left: 8px; border-left: 1px solid var(--border); }
    .nav-more summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 6px 8px; list-style: none; }
    .nav-more summary:hover { color: var(--text); }
    .nav-more[open] summary { color: var(--text); }
    .nav-more .nav-views { margin: 0; padding-left: 0; border-left: 0; }
    .retry-button { margin-top: 12px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); padding: 8px 14px; cursor: pointer; }
    .run-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .run-meta { display: flex; gap: 8px; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .main { min-width: 0; padding: 24px clamp(16px, 3vw, 42px) 48px; }
    #content { width: min(100%, 1240px); margin: 0 auto; }
    .topline { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); line-height: 1.15; }
    .eyebrow { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .freshness { color: var(--muted); font-size: 13px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 22px 0; }
    .metric { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; padding: 13px 15px; text-align: left; }
    .metric-action { cursor: pointer; }
    .metric-action:hover, .metric-action:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 4px; font-size: 22px; font-weight: 650; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
    .panel { min-width: 0; }
    .detail { position: sticky; top: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 17px; }
    .detail h2 { margin: 0 0 4px; font-size: 18px; }
    .detail h3 { margin: 18px 0 7px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .detail p { margin: 5px 0; overflow-wrap: anywhere; }
    .empty { border: 1px dashed var(--border); border-radius: 12px; padding: 28px; color: var(--muted); text-align: center; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 20px; }
    .project-card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: inherit; padding: 17px; text-align: left; cursor: pointer; }
    .project-card:hover { border-color: var(--accent); }
    .project-card[data-validation]:not([data-validation="valid"]) { border-color: var(--danger); }
    .project-path { margin-top: 7px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .portfolio-service { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
    .service-status { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .service-pill { border-radius: 999px; background: var(--surface-2); padding: 6px 10px; color: var(--muted); font-size: 12px; }
    .service-pill[data-status="synced"], .service-pill[data-status="written_local"] { color: var(--success); }
    .service-pill[data-status="error"], .service-pill[data-status="sync_failed"] { color: var(--danger); }
    .service-action { border: 1px solid var(--accent); border-radius: 9px; background: transparent; color: var(--accent); padding: 9px 13px; cursor: pointer; white-space: nowrap; }
    .service-action:hover { background: var(--accent-soft); }
    .agent-section { margin-top: 22px; }
    .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 12px; }
    .agent-card { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 14px; }
    .agent-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .agent-card-title { font-weight: 680; }
    .agent-tier { color: var(--muted); font-size: 11px; }
    .agent-layers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 11px; }
    .agent-layer { min-width: 0; border-top: 3px solid var(--border); padding-top: 6px; color: var(--muted); font-size: 10px; }
    .agent-layer[data-status="verified"] { border-color: var(--success); color: var(--text); }
    .agent-layer[data-status="configured"] { border-color: var(--warning); color: var(--text); }
    .agent-layer[data-status="blocked"] { border-color: var(--danger); color: var(--danger); }
    .agent-layer-label, .agent-layer-state { display: block; overflow-wrap: anywhere; }
    .agent-layer-state { margin-top: 3px; font-size: 9px; }
    .agent-evidence { margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .goal-card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 20px; margin: 20px 0; }
    .goal-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    .goal-text { margin: 7px 0 0; max-width: 900px; font-size: clamp(17px, 2.2vw, 23px); line-height: 1.45; font-weight: 620; }
    .progress-line { display: flex; justify-content: space-between; gap: 14px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .progress-track { height: 7px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
    .section-card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 17px; }
    .section-card h2 { margin: 0; font-size: 18px; }
    .section-help { margin: 5px 0 15px; color: var(--muted); font-size: 13px; }
    .attention-list { display: grid; gap: 8px; margin-top: 12px; }
    .attention-item { border-left: 3px solid var(--warning); border-radius: 8px; background: var(--surface-2); padding: 10px 12px; font-size: 13px; }
    .attention-item.error { border-left-color: var(--danger); color: var(--text); }
    .role-chip, .material-chip { display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-2); padding: 5px 9px; color: var(--muted); font-size: 12px; }
    .detail-section { margin-top: 17px; }
    .detail-section h3 { margin: 0 0 7px; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    .detail-section p { margin: 5px 0; line-height: 1.45; }
    .material-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .material-button { border: 1px solid var(--border); cursor: pointer; color: var(--text); }
    .material-button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .project-goal-source { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .version-focus { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
    .version-name { font-size: 13px; color: var(--muted); }
    .version-goal { margin: 5px 0 0; font-size: 15px; line-height: 1.5; font-weight: 580; }
    .version-progress { text-align: right; white-space: nowrap; }
    .version-progress strong { display: block; font-size: 22px; }
    .version-progress span { color: var(--muted); font-size: 12px; }
    .office-shell { margin-top: 18px; }
    .office-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
    .flow-line { display: flex; align-items: center; gap: 10px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-soft); padding: 10px 13px; }
    .flow-line[data-kind="suggested"] { border-style: dashed; }
    .flow-line[data-kind="suggested"] .flow-arrow { background: transparent; border-top: 2px dashed var(--accent); }
    .flow-kind { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .flow-role { display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .flow-avatar { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--surface); font-size: 10px; font-weight: 760; }
    .flow-arrow { position: relative; flex: none; width: 44px; height: 2px; background: var(--accent); overflow: visible; }
    .flow-arrow::after { content: ""; position: absolute; right: -1px; top: -3.5px; border: 4.5px solid transparent; border-left-color: var(--accent); }
    .flow-arrow::before { content: ""; position: absolute; left: 0; top: -2.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: flow-dot 1.4s linear infinite; }
    @keyframes flow-dot { to { transform: translateX(37px); opacity: 0; } }
    .office-scroll { overflow-x: auto; padding: 4px 1px 8px; }
    .office-grid { min-width: 760px; display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; margin-top: 17px; }
    .office-role { position: relative; min-height: 145px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); color: inherit; padding: 14px; text-align: left; cursor: pointer; transition: border-color .18s ease, transform .18s ease, background .18s ease; }
    .office-role:hover { border-color: var(--accent); transform: translateY(-2px); }
    .office-role[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .office-role[data-flow="source"] { box-shadow: inset 0 -3px 0 var(--warning); }
    .office-role[data-flow="target"] { box-shadow: inset 0 -3px 0 var(--accent); }
    .office-role[data-flow="source"] .role-avatar, .office-role[data-flow="target"] .role-avatar { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 4px var(--accent); }
    .office-role[data-status="active"] .role-light { background: var(--accent); animation: role-pulse 1.6s ease-in-out infinite; }
    .office-role[data-status="waiting"] .role-light { background: var(--warning); }
    .office-role[data-status="completed"] .role-light { background: var(--success); }
    .office-role[data-status="idle"] { color: var(--muted); }
    .office-role[data-status="idle"] .role-light { background: var(--border); }
    @keyframes role-pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); } }
    .role-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .role-avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); font-size: 12px; font-weight: 760; letter-spacing: .02em; }
    .role-light { width: 9px; height: 9px; border-radius: 50%; }
    .role-name { display: block; margin-top: 14px; font-weight: 720; }
    .role-state { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .role-summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .transition-trail { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .transition-pill { border-radius: 999px; background: var(--surface-2); padding: 5px 9px; color: var(--muted); font-size: 11px; }
    .transition-pill[data-current="true"] { background: var(--accent-soft); color: var(--text); }
    .project-overview-hero { margin-top: 22px; border-top: 3px solid var(--accent); border-bottom: 1px solid var(--border); background: var(--surface); }
    .overview-hero-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, .7fr); }
    .overview-story { padding: clamp(20px, 3vw, 34px); }
    .version-kicker { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .overview-version-goal { margin: 9px 0 0; max-width: 820px; font-size: clamp(21px, 2.5vw, 30px); font-weight: 660; line-height: 1.32; }
    .overview-progress { margin-top: 24px; max-width: 720px; }
    .overview-status-strip { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .overview-status-item strong { margin-left: 5px; color: var(--text); font-size: 13px; }
    .overview-command { display: grid; align-content: center; gap: 18px; padding: clamp(20px, 3vw, 30px); border-left: 1px solid var(--border); background: var(--surface-soft); }
    .command-item { display: grid; gap: 5px; }
    .command-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .command-value { font-size: 15px; font-weight: 650; line-height: 1.4; }
    .command-value[data-alert="true"] { color: var(--danger); }
    .project-purpose { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; margin: 0; padding: 18px 4px; border-bottom: 1px solid var(--border); }
    .project-purpose-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .project-purpose-copy { margin: 0; max-width: 900px; font-size: 15px; line-height: 1.55; }
    .project-purpose-source { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .office-roles { display: flex; flex-direction: column; margin-top: 12px; border-top: 1px solid var(--border); }
    .office-role-row { display: grid; grid-template-columns: 34px 9px minmax(80px, .5fr) minmax(90px, .55fr) minmax(180px, 1.5fr); gap: 12px; align-items: center; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: inherit; padding: 12px 3px; text-align: left; cursor: pointer; transition: background .15s ease; }
    .office-role-row:hover { background: var(--surface-soft); }
    .office-role-row[aria-pressed="true"] { background: var(--accent-soft); }
    .office-role-row[data-current="true"] { box-shadow: inset 3px 0 0 var(--accent); }
    .office-role-row[data-status="idle"] { color: var(--muted); }
    .office-role-row[data-status="active"] .role-light { background: var(--accent); animation: role-pulse 1.6s ease-in-out infinite; }
    .office-role-row[data-status="waiting"] .role-light { background: var(--warning); }
    .office-role-row[data-status="completed"] .role-light { background: var(--success); }
    .office-role-row[data-status="idle"] .role-light { background: var(--border); }
    .role-brief { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .office-flow-rail { display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--accent); background: var(--surface-soft); padding: 10px 13px; }
    .office-flow-rail[data-kind="suggested"] { border-left-style: dashed; }
    .role-drawer-backdrop { position: fixed; inset: 0; background: color-mix(in srgb, var(--code-bg) 40%, transparent); z-index: 90; }
    .role-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 94vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 91; overflow-y: auto; padding: var(--space-6); }
    .role-drawer-close { float: right; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius-sm); padding: 4px 12px; cursor: pointer; }
    /* 工作台首屏与项目概览：以用户决策顺序组织，不使用后台表格。 */
    .workbench-card { margin-top: 20px; }
    .office-shell + .section-card { margin-top: 18px; }
    .inbox-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .workbench-priority { margin-top: 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 15px 0; }
    .priority-summary { display: flex; gap: 12px; align-items: baseline; }
    .priority-count { color: var(--accent); font-size: 28px; font-weight: 720; }
    .priority-copy { color: var(--muted); font-size: 13px; }
    .inbox-items { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .inbox-item { border: 0; border-left: 2px solid var(--warning); background: var(--surface-soft); padding: 6px 10px; color: var(--muted); font-size: 12px; }
    .inbox-item.error { border-left-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    button.inbox-item { cursor: pointer; }
    button.inbox-item:hover, button.inbox-item:focus-visible { color: var(--accent); background: var(--accent-soft); }
    .project-summary-list { display: grid; margin-top: 7px; border-top: 1px solid var(--border); }
    .project-summary-row { width: 100%; display: grid; grid-template-columns: minmax(150px, .65fr) minmax(220px, 1.5fr) minmax(90px, .45fr) minmax(120px, .55fr) 18px; gap: 16px; align-items: center; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: inherit; padding: 14px 4px; text-align: left; cursor: pointer; }
    .project-summary-row:hover { background: var(--surface-soft); }
    .project-summary-row:hover .project-row-arrow { color: var(--accent); transform: translateX(2px); }
    .project-name { display: block; font-weight: 680; }
    .project-stage { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .project-next-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .project-next { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.45; }
    .project-owner { font-size: 12px; font-weight: 620; }
    .project-progress { display: grid; gap: 6px; color: var(--muted); font-size: 11px; }
    .project-attention { color: var(--warning); font-weight: 620; }
    .project-attention[data-blocked="true"] { color: var(--danger); }
    .project-progress-track { height: 4px; overflow: hidden; background: var(--surface-2); }
    .project-progress-fill { height: 100%; background: var(--accent); }
    .project-row-arrow { color: var(--muted); font-size: 18px; transition: transform .15s ease, color .15s ease; }

      .brain-grid { grid-template-columns: 1fr; }
      .brain-repository-line { grid-template-columns: 1fr; gap: 5px; }
      .portfolio-service { grid-template-columns: 1fr; }
      .git-branch-row { grid-template-columns: 1fr; }
      .markdown-shell { grid-template-columns: 1fr; }
      .document-outline { position: static; max-height: 220px; }
      .detail { position: static; }
      .overview-hero-grid { grid-template-columns: 1fr; }
      .overview-command { grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 0; border-top: 1px solid var(--border); }
      .workbench-secondary { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .project-summary-row { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; }
      .project-identity { grid-column: 1; grid-row: 1; }
      .project-row-arrow { grid-column: 2; grid-row: 1; }
      .project-next-wrap { grid-column: 1 / -1; grid-row: 2; }
      .project-owner { grid-column: 1; grid-row: 3; }
      .project-progress { grid-column: 2; grid-row: 3; min-width: 100px; }
      .project-purpose { grid-template-columns: 1fr; gap: 7px; }
      .office-role-row { grid-template-columns: 32px 9px minmax(80px, 1fr) auto; gap: 9px; }
      .role-brief { grid-column: 3 / -1; }
    }
    @media (max-width: 560px) {
      .main { padding: 18px 14px 36px; }
      .nav-project { min-width: 0; }
      .nav-meta { gap: 5px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .lane { grid-template-columns: 1fr; gap: 5px; }
      .lane-label { padding-top: 0; }
      .event-row { grid-template-columns: 50px minmax(0, 1fr); }
      .event-time { display: none; }
      .overview-story { padding: 18px; }
      .overview-version-goal { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; font-size: 21px; }
      .overview-command { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 18px; }
      .command-label { font-size: 9px; }
      .command-value { font-size: 12px; }
      .overview-status-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .flow-line, .office-flow-rail { flex-wrap: wrap; }
      .flow-arrow { width: 28px; }
      .system-row { align-items: flex-start; flex-wrap: wrap; }
      .system-label { min-width: 0; width: 100%; }
      .delivery-item { flex-wrap: wrap; }
      .delivery-summary { flex-basis: calc(100% - 48px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="项目导航">
      <p class="brand">Harness 项目导航</p>
      <p id="portfolio-summary" class="subtitle">正在整理项目…</p>
      <nav id="nav-tree" class="nav-tree" aria-label="项目与视图"></nav>
    </aside>
    <main class="main">
      <div id="content" aria-live="polite">
        <div class="empty">正在整理项目进展…</div>
      </div>
    </main>
  </div>
  <script>
    (() => {
      const state = { portfolio: null, agents: null, brainHealth: null, brainCandidates: [], projectMemories: [], brainSyncConfirm: false, brainSyncPreview: null, focus: null, project: null, index: null, run: null, snapshot: null, workspace: null, events: [], view: "overview", taskId: null, selectedRole: null, artifactPath: null, artifactDocument: null, artifactError: null, notice: null };
      const navTree = document.getElementById("nav-tree");
      const portfolioSummary = document.getElementById("portfolio-summary");
      const content = document.getElementById("content");
      const networkRetryDelaysMs = [0, 300, 900];

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function fetchWithRetry(url) {
        let lastError = null;
        for (const delayMs of networkRetryDelaysMs) {
          if (delayMs) await wait(delayMs);
          try {
            return await fetch(url, { cache: "no-store" });
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError;
      }

      async function fetchJson(url) {
        const response = await fetchWithRetry(url);
        if (!response.ok) throw new Error(`${url} returned ${response.status}`);
        return response.json();
      }

      async function postBrain(url, body = {}) {
        const response = await fetch(url, {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Harness-Action-Token": state.brainHealth?.action_token || ""
          },
          body: JSON.stringify(body)
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `${url} returned ${response.status}`);
        return value;
      }

      function brainDialog({ title, description, confirmLabel = "确认", danger = false, fields = [] }) {
        return new Promise(resolve => {
          const backdrop = el("div", "brain-dialog-backdrop");
          const dialog = el("section", "brain-dialog");
          dialog.setAttribute("role", "dialog");
          dialog.setAttribute("aria-modal", "true");
          dialog.setAttribute("aria-labelledby", "brain-dialog-title");
          const form = el("form", "brain-dialog-form");
          const heading = el("h2", "", title);
          heading.id = "brain-dialog-title";
          form.append(heading);
          if (description) form.append(el("p", "brain-dialog-description", description));
          const fieldWrap = el("div", "brain-dialog-fields");
          const controls = new Map();
          fields.forEach(field => {
            const label = el("label", "brain-dialog-field", field.label);
            let control;
            if (field.type === "select") {
              control = el("select", "");
              (field.options || []).forEach(option => {
                const node = el("option", "", option.label || option.value);
                node.value = option.value;
                control.append(node);
              });
            } else if (field.type === "textarea") {
              control = el("textarea", "");
            } else {
              control = el("input", "");
              control.type = field.type || "text";
            }
            control.name = field.name;
            control.value = field.value || "";
            control.required = Boolean(field.required);
            if (field.placeholder) control.placeholder = field.placeholder;
            label.append(control);
            fieldWrap.append(label);
            controls.set(field.name, control);
          });
          if (fields.length) form.append(fieldWrap);
          const actions = el("div", "brain-dialog-actions");
          const cancel = el("button", "brain-dialog-cancel", "取消");
          cancel.type = "button";
          const submit = el("button", "brain-dialog-submit", confirmLabel);
          submit.type = "submit";
          submit.dataset.danger = String(danger);
          actions.append(cancel, submit); form.append(actions); dialog.append(form); backdrop.append(dialog);

          const close = value => {
            document.removeEventListener("keydown", onKeydown);
            backdrop.remove();
            resolve(value);
          };
          const onKeydown = event => {
            if (event.key === "Escape") close(null);
          };
          cancel.addEventListener("click", () => close(null));
          backdrop.addEventListener("click", event => { if (event.target === backdrop) close(null); });
          form.addEventListener("submit", event => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            close(Object.fromEntries(Array.from(controls, ([name, control]) => [name, control.value.trim()])));
          });
          document.addEventListener("keydown", onKeydown);
          document.body.append(backdrop);
          (controls.values().next().value || submit).focus();
        });
      }

      async function fetchEvents(projectId, runId) {
        const response = await fetchWithRetry(`/api/projects/${encodeURIComponent(projectId)}/runs/${encodeURIComponent(runId)}/events.jsonl`);
        if (!response.ok) throw new Error(`events returned ${response.status}`);
        const text = await response.text();
        return text.split("\n").filter(Boolean).map(line => JSON.parse(line));
      }

      function readUrlState() {
        const params = new URLSearchParams(location.search);
        const rawView = params.get("view");
        state.view = ALL_VIEWS.includes(rawView) ? rawView : "workbench";
        state.taskId = params.get("task");
        state.selectedRole = params.get("role");
        state.artifactPath = params.get("artifact");
        state.focus = params.get("focus");
        return { projectId: params.get("project"), runId: params.get("run") };
      }

      function writeUrlState() {
        const params = new URLSearchParams();
        if (state.project) params.set("project", state.project.project_id);
        if (state.run) params.set("run", state.run.run_id);
        params.set("view", state.view);
        if (state.taskId) params.set("task", state.taskId);
        if (state.selectedRole) params.set("role", state.selectedRole);
        if (state.artifactPath) params.set("artifact", state.artifactPath);
        if (state.focus) params.set("focus", state.focus);
        history.replaceState(null, "", `?${params.toString()}`);
      }

      function statusLabel(value) {
        const labels = {
          observing: "观察中", active: "进行中", in_progress: "进行中", blocked: "已阻塞",
          verification_pending: "待验证", completed: "已完成", skipped: "已跳过",
          discovered: "待开始", ready: "可执行", abandoned: "已终止", unavailable: "不可用",
          session_started: "会话活跃", turn_started: "处理中", turn_completed: "等待下一轮", session_ended: "会话结束",
          started: "执行中", ready: "可用", synced: "已同步", pending: "待同步",
          error: "同步失败", not_configured: "未配置", unavailable: "不可用", written_local: "已写入本地"
        };
        return labels[value] || value || "未知";
      }

      function roleLabel(value) {
        const labels = {
          PM: "PM", Planner: "PM", Designer: "设计", Executor: "开发",
          QA: "测试", Reviewer: "Review", Orchestrator: "协调", Unknown: "待分配"
        };
        return labels[value] || value || "待分配";
      }

      function summaryForEvent(event) {
        const payload = event.payload || {};
        return payload.summary || payload.reason || payload.title || payload.path || payload.check || `${event.subject.kind}: ${event.subject.id}`;
      }

      function compactText(value, fallback = "尚未回写可读说明") {
        const text = String(value || "").replace(/\s+/g, " ").trim();
        return text || fallback;
      }

      function formattedTime(value) {
        if (!value) return "尚未同步";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      const ALL_VIEWS = ["workbench", "settings", "overview", "workflow", "versions", "artifacts", "agents", "timeline", "events", "runs"];
      const GLOBAL_VIEWS = [["workbench", "工作台"], ["settings", "设置"]];
      const PROJECT_VIEWS = [["overview", "概览"], ["workflow", "工作流"], ["versions", "版本"], ["artifacts", "产物"]];
      const DIAG_VIEWS = [["agents", "Agent 接入"], ["timeline", "技术记录"], ["events", "事件日志"], ["runs", "原始运行"]];

      function renderNavTree() {
        navTree.replaceChildren();
        const projects = state.portfolio?.projects || [];
        const validCount = projects.filter(item => item.validation === "valid").length;
        portfolioSummary.textContent = `${validCount}/${projects.length} 个项目可用`;

        const global = el("div", "nav-views");
        GLOBAL_VIEWS.forEach(([value, label]) => {
          const item = el("button", "nav-view");
          item.type = "button";
          item.setAttribute("aria-current", String(!state.project && state.view === value));
          item.append(el("span", "", label));
          item.addEventListener("click", () => { state.view = value; state.focus = null; selectProject(null); });
          global.append(item);
        });
        navTree.append(global);

        const projectLabel = el("div", "nav-section-label");
        projectLabel.append(el("span", "", "所有项目"), el("span", "nav-count", `${projects.length} 个登记`));
        navTree.append(projectLabel);

        projects.forEach(project => {
          const expanded = state.project?.project_id === project.project_id;
          const button = el("button", "nav-project");
          button.type = "button";
          button.dataset.validation = project.validation;
          button.setAttribute("aria-current", String(expanded));
          button.setAttribute("aria-expanded", String(expanded && project.validation === "valid"));
          const head = el("span", "nav-project-head");
          head.append(el("span", "nav-expander", expanded && project.validation === "valid" ? "▾" : "▸"), el("span", "nav-name", project.name));
          button.append(head);
          const meta = el("span", "nav-meta");
          meta.append(el("span", "", project.validation === "valid" ? project.stage : "不可用"));
          meta.append(el("span", "", project.validation === "valid" ? roleLabel(project.owner_role) : project.validation));
          button.append(meta);
          button.addEventListener("click", () => selectProject(project.project_id));
          navTree.append(button);

          if (!expanded || project.validation !== "valid") return;
          const views = el("div", "nav-views");
          PROJECT_VIEWS.forEach(([value, label]) => {
            const item = el("button", "nav-view");
            item.type = "button";
            item.setAttribute("aria-current", String(state.view === value));
            item.append(el("span", "", label));
            const blocks = state.snapshot?.summary?.active_blocks ?? project.summary?.active_blocks ?? 0;
            if (value === "overview" && blocks > 0) item.append(el("span", "nav-badge", `●${blocks} 阻塞`));
            item.addEventListener("click", () => { state.view = value; writeUrlState(); render(); });
            views.append(item);
          });
          navTree.append(views);

          const more = el("details", "nav-more");
          more.append(el("summary", "", "更多 · 诊断"));
          const diag = el("div", "nav-views");
          DIAG_VIEWS.forEach(([value, label]) => {
            const item = el("button", "nav-view");
            item.type = "button";
            item.setAttribute("aria-current", String(state.view === value));
            item.append(el("span", "", label));
            item.addEventListener("click", () => { state.view = value; writeUrlState(); render(); });
            diag.append(item);
          });
          more.append(diag);
          navTree.append(more);
        });
      }

      function metric(label, value) {
        const box = el("div", "metric");
        box.append(el("span", "metric-label", label), el("span", "metric-value", value));
        return box;
      }

      function actionMetric(label, value, focus) {
        const box = el("button", "metric metric-action");
        box.type = "button";
        box.append(el("span", "metric-label", label), el("span", "metric-value", value));
        box.addEventListener("click", () => openBrainFocus(focus));
        return box;
      }

      function focusBrainSection() {
        if (!state.focus) return;
        const target = document.getElementById(`brain-${state.focus}`);
        if (!target) return;
        requestAnimationFrame(() => {
          if (target.tagName === "DETAILS") target.open = true;
          const parentDetails = target.closest("details");
          if (parentDetails) parentDetails.open = true;
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          target.focus({ preventScroll: true });
        });
      }

      function openBrainFocus(focus) {
        state.project = null;
        state.index = null;
        state.run = null;
        state.snapshot = null;
        state.workspace = null;
        state.events = [];
        state.view = "settings";
        state.focus = focus;
        writeUrlState();
        render();
      }

      async function refreshBrain() {
        const [health, candidates, memories] = await Promise.all([
          fetchJson("/api/brain/status.json"),
          fetchJson("/api/brain/candidates.json"),
          fetchJson("/api/brain/project-memory.json")
        ]);
        state.brainHealth = health;
        state.brainCandidates = candidates.items || [];
        state.projectMemories = memories.items || [];
        render();
      }

      function brainAction(label, action, className = "") {
        const button = el("button", className, label);
        button.type = "button";
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const result = await action();
            state.notice = typeof result === "string" ? result : null;
            await refreshBrain();
          } catch (error) {
            state.notice = `Brain 操作失败：${error.message}`;
            render();
          } finally {
            button.disabled = false;
          }
        });
        return button;
      }

      function renderBrain() {
        content.replaceChildren();
        const health = state.brainHealth || {};
        const repository = health.repository || {};
        const pendingSync = Number(health.remote_sync?.pending_local_records || 0);
        const repositoryEffective = Boolean(repository.git && repository.remote_matches_config && repository.branch && repository.upstream);
        const top = el("div", "topline");
        const titleWrap = el("div", "");
        titleWrap.append(el("div", "eyebrow", "设置 · 本机记忆服务"), el("h1", "", "记忆与同步"));
        top.append(titleWrap, el("div", "freshness", health.generated_at || "尚未读取"));
        content.append(top);
        const back = el("button", "service-action", "← 返回工作台");
        back.type = "button";
        back.addEventListener("click", () => { state.view = "workbench"; state.focus = null; selectProject(null); });
        content.append(back);
        content.append(el("p", "section-help", "本机服务自动记录已确认的工作事实；Hook 只负责采集事件，Prompt 只辅助识别含义，关闭会话不是写入前提。远端发送前，先核对这一次具体会上传什么。"));
        if (state.notice) content.append(el("p", "warning-line", state.notice));

        const stack = el("div", "brain-stack");

        const sync = el("section", "brain-card");
        sync.id = "brain-sync";
        sync.tabIndex = -1;
        const syncOverview = el("div", "brain-sync-overview");
        const syncCopy = el("div", "");
        syncCopy.append(el("h2", "", "本次同步清单"));
        syncCopy.append(el("p", "section-help", "先由本机后端读取真实 Git 状态并生成清单；查看清单不会上传、提交或修改任何文件。"));
        const syncStatus = el("div", "brain-sync-status");
        syncStatus.append(
          el("span", "", `本地写入 · ${health.local_write?.status || "未知"}`),
          el("span", "", `项目记录待同步 · ${pendingSync}`),
          el("span", "", `远端同步 · ${health.remote_sync?.status || "未知"}`)
        );
        syncCopy.append(syncStatus);
        const previewButton = el("button", "brain-sync-button", state.brainSyncPreview ? "重新读取清单" : "查看同步清单");
        previewButton.type = "button";
        previewButton.addEventListener("click", async () => {
          previewButton.disabled = true;
          state.notice = null;
          try {
            state.brainSyncPreview = await postBrain("/api/brain/sync", { dry_run: true });
            state.brainSyncConfirm = true;
          } catch (error) {
            state.brainSyncPreview = null;
            state.brainSyncConfirm = false;
            state.notice = `无法生成同步清单：${error.message}`;
          }
          render();
        });
        syncOverview.append(syncCopy, previewButton);
        sync.append(syncOverview);

        const preview = state.brainSyncPreview;
        if (preview) {
          const manifest = el("div", "brain-sync-manifest");
          const destination = preview.destination || {};
          const destinationBox = el("div", "brain-destination");
          destinationBox.append(
            el("span", "", "发送到"), el("strong", "", destination.remote || "未配置仓库"),
            el("span", "", "远端分支"), el("strong", "", destination.upstream || destination.branch || "未识别"),
            el("span", "", "隐私状态"), el("strong", "", destination.privacy || "未验证")
          );
          manifest.append(destinationBox);

          const groupLabels = { project: "项目事实", global: "全局偏好", profile: "Profile", session: "Session 补漏" };
          const groups = el("div", "brain-sync-groups");
          Object.entries(groupLabels).forEach(([key, label]) => groups.append(el("span", "brain-sync-group", `${label} ${preview.groups?.[key] || 0}`)));
          manifest.append(groups);

          const records = el("details", "brain-manifest-details");
          records.open = true;
          records.append(el("summary", "", `待同步记录 ${(preview.items || []).length}`));
          const recordList = el("div", "brain-manifest-list");
          (preview.items || []).forEach(record => {
            const item = el("div", "brain-manifest-item", record.summary || "未提供摘要");
            item.append(el("span", "muted", `${record.scope || "未知范围"}${record.project ? ` · ${record.project}` : ""} → ${record.destination || "未识别路径"}`));
            recordList.append(item);
          });
          if (!recordList.children.length) recordList.append(el("div", "empty", "没有待写入的新记录；仍需检查下方是否存在待推送提交。"));
          records.append(recordList); manifest.append(records);

          const files = el("details", "brain-manifest-details");
          files.append(el("summary", "", `涉及文件 ${(preview.pending_files || []).length}`));
          const fileList = el("div", "brain-manifest-list");
          (preview.pending_files || []).forEach(path => fileList.append(el("code", "", path)));
          if (!fileList.children.length) fileList.append(el("div", "empty", "没有新的 Harness 管理文件等待提交。"));
          files.append(fileList); manifest.append(files);

          const commits = el("details", "brain-manifest-details");
          commits.append(el("summary", "", `待推送提交 ${(preview.pending_commits || []).length}`));
          const commitList = el("div", "brain-manifest-list");
          (preview.pending_commits || []).forEach(commit => {
            const item = el("div", "brain-manifest-item", `${commit.sha} · ${commit.subject}`);
            item.append(el("span", "muted", `${commit.committed_at || "未知时间"} · ${(commit.files || []).length} 个文件`));
            commitList.append(item);
          });
          if (!commitList.children.length) commitList.append(el("div", "empty", "当前分支没有领先远端的既有提交。"));
          commits.append(commitList); manifest.append(commits);

          const privacy = el("div", "brain-privacy");
          privacy.append(el("strong", "", "明确不会上传"));
          privacy.append(el("div", "", (preview.excluded_content || []).join("；") || "尚未取得排除清单。"));
          manifest.append(privacy);
          manifest.append(el("p", "brain-confirm-note", preview.push_scope_note || "Git 同步范围尚未说明，不能继续。"));

          const actions = el("div", "brain-sync-confirm-actions");
          if (preview.can_sync && state.brainSyncConfirm) {
            actions.append(brainAction("确认并同步", async () => {
              const result = await postBrain("/api/brain/sync", { confirmed: true });
              state.brainSyncPreview = null;
              state.brainSyncConfirm = false;
              return `Brain 同步完成：${result.synced_records || 0} 条项目级记录，${result.synced_candidates || 0} 条已批准候选。`;
            }, "brain-sync-button"));
          }
          const cancelButton = el("button", "brain-sync-cancel", "取消同步");
          cancelButton.type = "button";
          cancelButton.addEventListener("click", () => { state.brainSyncPreview = null; state.brainSyncConfirm = false; render(); });
          actions.append(cancelButton); manifest.append(actions);
          sync.append(manifest);
        }
        if (health.remote_sync?.last_error) sync.append(el("p", "error", health.remote_sync.last_error));
        stack.append(sync);

        const inbox = el("section", "brain-card");
        inbox.id = "brain-approvals";
        inbox.tabIndex = -1;
        inbox.append(el("h2", "", "全局待审批"));

      function renderAgents(container) {
        const agentSection = el("section", "section-card agent-section");
        agentSection.append(el("h2", "", "Code Agent 接入状态"));
        agentSection.append(el("p", "section-help", "五层状态分开验证；装好规则或 Hook 不等于当前会话已经加载。"));
        const agentGrid = el("div", "agent-grid");
        const layerLabels = { discovered: "发现", injected: "注入", loaded: "加载", execution: "遵循", feedback: "回写" };
        const layerStates = { verified: "已验证", configured: "待真实会话", unverified: "未验证", not_detected: "未发现", blocked: "有冲突" };
        (state.agents?.agents || []).forEach(agent => {
          const card = el("article", "agent-card");
          const head = el("div", "agent-card-head");
          head.append(el("span", "agent-card-title", agent.name), el("span", "agent-tier", `Tier ${agent.tier}`));
          card.append(head);
          const layers = el("div", "agent-layers");
          Object.entries(layerLabels).forEach(([key, label]) => {
            const layer = el("div", "agent-layer");
            const status = agent.layers?.[key]?.status || "unverified";
            layer.dataset.status = status;
            layer.append(el("span", "agent-layer-label", label), el("span", "agent-layer-state", layerStates[status] || status));
            layers.append(layer);
          });
          card.append(layers);
          const evidence = agent.evidence || {};
          const evidenceProjects = (evidence.projects || []).join("、");
          card.append(el("div", "agent-evidence", evidence.event_count ? `${evidence.event_count} 条回写证据${evidenceProjects ? ` · ${evidenceProjects}` : ""}` : "尚无真实会话证据"));
          agentGrid.append(card);
        });
        if (!agentGrid.childElementCount) agentGrid.append(el("div", "empty", "尚未取得 Agent 检测结果。"));
        agentSection.append(agentGrid);
        container.append(agentSection);
      }

          return;

        const list = el("div", "runs-list");
        runs.forEach(run => {
          const button = el("button", "runs-row");
          button.type = "button";
          button.dataset.current = String(state.run?.run_id === run.run_id);
          const head = el("div", "runs-row-head");
          head.append(el("span", "", run.name || run.run_id), el("span", "muted", run.status || "observing"));
          button.append(head);
          const meta = el("div", "runs-row-meta");
          meta.append(el("span", "muted", run.run_id));

          button.addEventListener("click", () => selectRun(run.run_id));
          list.append(button);
        });
        section.append(list);
        container.append(section);

      function resolveArtifactLink(documentPath, href) {
        const clean = String(href).split("#", 1)[0].split("?", 1)[0];
        if (!clean || clean.startsWith("/") || /^[a-z][a-z0-9+.-]*:/i.test(clean)) return null;
        const parts = String(documentPath || "").split("/").slice(0, -1);
        for (const segment of clean.split("/")) {
          if (!segment || segment === ".") continue;
          if (segment === "..") {
            if (!parts.length) return null;
            parts.pop();
          } else {
            parts.push(segment);
          }
        }
        return parts.join("/");
      }

      function appendInlineMarkdown(parent, value, documentPath = "") {
        const source = String(value);
        const tokenPattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_|\[[^\]\n]+\]\([^)\s]+(?:\s+"[^"\n]*")?\))/g;
        let offset = 0;
        for (const match of source.matchAll(tokenPattern)) {
          if (match.index > offset) parent.append(document.createTextNode(source.slice(offset, match.index)));
          const token = match[0];
          if (token.startsWith("`") && token.endsWith("`")) {
            parent.append(el("code", "", token.slice(1, -1)));
          } else if ((token.startsWith("**") && token.endsWith("**")) || (token.startsWith("__") && token.endsWith("__"))) {
            parent.append(el("strong", "", token.slice(2, -2)));
          } else if ((token.startsWith("*") && token.endsWith("*")) || (token.startsWith("_") && token.endsWith("_"))) {
            parent.append(el("em", "", token.slice(1, -1)));
          } else {
            const link = token.match(/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)$/);
            const anchor = el("a", "", link[1]);
            if (link[3]) anchor.title = link[3];
            if (/^https?:\/\//i.test(link[2]) || /^mailto:/i.test(link[2])) {
              anchor.href = link[2];
              anchor.target = "_blank";
              anchor.rel = "noopener noreferrer";
            } else {
              const artifactPath = resolveArtifactLink(documentPath, link[2]);
              const readable = artifactPath && (state.workspace?.artifacts || []).some(item => item.path === artifactPath);
              anchor.href = readable ? "#" : link[2].startsWith("#") ? link[2] : "#";
              if (readable) {
                anchor.addEventListener("click", event => { event.preventDefault(); openArtifact(artifactPath); });
              } else if (!link[2].startsWith("#")) {
                anchor.addEventListener("click", event => event.preventDefault());
                anchor.title = anchor.title || "该链接未登记为可读产物";
              }
            }
            parent.append(anchor);
          }
          offset = match.index + token.length;
        }
        if (offset < source.length) parent.append(document.createTextNode(source.slice(offset)));
      }
