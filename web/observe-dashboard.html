<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mick Harness · 项目导航</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f6f7f9, #111317);
      --surface: light-dark(#ffffff, #191c22);
      --surface-2: light-dark(#eef1f5, #232730);
      --text: light-dark(#17191d, #f1f3f5);
      --muted: light-dark(#616977, #a9b0bd);
      --border: light-dark(#d9dee7, #353b47);
      --accent: light-dark(#2457d6, #89a9ff);
      --accent-soft: light-dark(#e7edff, #24335d);
      --danger: light-dark(#b3261e, #ffaaa4);
      --warning: light-dark(#8a5800, #ffd089);
      --success: light-dark(#1c6b3c, #88d3a6);
      --surface-soft: light-dark(#f5f7fa, #1e222a);
      --danger-soft: light-dark(#fdecec, #3a2626);
      --warning-soft: light-dark(#fdf3e0, #3a2f1a);
      --success-soft: light-dark(#e9f6ee, #1f3327);
      --code-bg: light-dark(#111827, #0b0d11);
      --code-fg: #e7eaf0;
      --code-header-bg: #181d27;
      --code-header-fg: #c8d2e4;
      --code-gutter-fg: #667085;
      --code-gutter-bg: #111827;
      --fs-page-title: 30px;
      --fs-section-title: 19px;
      --fs-body: 15px;
      --fs-caption: 12.5px;
      --fs-mono: 12px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
    .sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 22px 16px; }
    .brand { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .subtitle { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .nav-tree { display: grid; gap: 2px; }
    .nav-project, .nav-view {
      width: 100%; text-align: left; border: 0; border-radius: 8px;
      background: transparent; color: inherit; cursor: pointer; font: inherit;
    }
    .nav-section-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 14px 10px 5px; padding-top: 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .nav-section-label .nav-count { font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .nav-project { padding: 8px 10px; display: grid; gap: 3px; margin-top: 2px; }
    .nav-project:hover { background: var(--surface-2); }
    .nav-project[aria-current="true"] { background: var(--accent-soft); }
    .nav-project-head { display: flex; gap: 6px; align-items: center; }
    .nav-expander { width: 14px; color: var(--muted); font-size: 11px; flex: none; }
    .nav-name { font-weight: 600; overflow-wrap: anywhere; }
    .nav-project[data-validation]:not([data-validation="valid"]) .nav-name { color: var(--danger); }
    .nav-meta { display: flex; gap: 8px; padding-left: 20px; color: var(--muted); font-size: 12px; }
    .nav-views { display: grid; gap: 1px; margin: 2px 0 8px 22px; padding-left: 8px; border-left: 1px solid var(--border); }
    .nav-view { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 6px 8px; color: var(--muted); }
    .nav-view:hover { background: var(--surface-2); color: var(--text); }
    .nav-view[aria-current="true"] { color: var(--text); font-weight: 650; background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-badge { color: var(--danger); font-size: 11px; font-weight: 650; }
    .nav-more { margin: 2px 0 8px 22px; padding-left: 8px; border-left: 1px solid var(--border); }
    .nav-more summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 6px 8px; list-style: none; }
    .nav-more summary:hover { color: var(--text); }
    .nav-more[open] summary { color: var(--text); }
    .nav-more .nav-views { margin: 0; padding-left: 0; border-left: 0; }
    .nav-invalid-group { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    .nav-invalid-group summary { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; color: var(--danger); cursor: pointer; font-size: 12px; font-weight: 700; list-style: none; }
    .nav-invalid-project { margin: 4px 0; border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--border)); border-radius: 10px; padding: 7px; }
    .nav-invalid-project .nav-project { margin: 0; padding: 5px; }
    .nav-invalid-actions { display: flex; gap: 6px; padding: 4px 5px 1px; }
    .project-unregister { border: 1px solid var(--danger); border-radius: 7px; background: transparent; color: var(--danger); padding: 5px 8px; cursor: pointer; font-size: 11px; }
    .project-remove-confirm { margin-top: 6px; border-radius: 8px; background: var(--danger-soft); padding: 9px; color: var(--text); font-size: 11px; line-height: 1.45; }
    .project-remove-confirm strong { display: block; margin-bottom: 4px; }
    .project-remove-actions { display: flex; gap: 6px; margin-top: 8px; }
    .project-remove-actions button { border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); padding: 5px 8px; cursor: pointer; }
    .project-remove-actions button[data-danger="true"] { border-color: var(--danger); background: var(--danger); color: white; }
    .retry-button { margin-top: 12px; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); padding: 8px 14px; cursor: pointer; }
    .run-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .run-meta { display: flex; gap: 8px; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .main { min-width: 0; padding: 24px clamp(16px, 3vw, 42px) 48px; }
    #content { width: min(100%, 1240px); margin: 0 auto; }
    .topline { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); line-height: 1.15; }
    .eyebrow { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .freshness { color: var(--muted); font-size: 13px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 22px 0; }
    .metric { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; padding: 13px 15px; text-align: left; }
    .metric-action { cursor: pointer; }
    .metric-action:hover, .metric-action:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 4px; font-size: 22px; font-weight: 650; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
    .panel { min-width: 0; }
    .detail { position: sticky; top: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 17px; }
    .detail h2 { margin: 0 0 4px; font-size: 18px; }
    .detail h3 { margin: 18px 0 7px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .detail p { margin: 5px 0; overflow-wrap: anywhere; }
    .empty { border: 1px dashed var(--border); border-radius: 12px; padding: 28px; color: var(--muted); text-align: center; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 20px; }
    .project-card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: inherit; padding: 17px; text-align: left; cursor: pointer; }
    .project-card:hover { border-color: var(--accent); }
    .project-card[data-validation]:not([data-validation="valid"]) { border-color: var(--danger); }
    .project-path { margin-top: 7px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .portfolio-service { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
    .service-status { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .service-pill { border-radius: 999px; background: var(--surface-2); padding: 6px 10px; color: var(--muted); font-size: 12px; }
    .service-pill[data-status="synced"], .service-pill[data-status="written_local"] { color: var(--success); }
    .service-pill[data-status="error"], .service-pill[data-status="sync_failed"] { color: var(--danger); }
    .service-action { border: 1px solid var(--accent); border-radius: 9px; background: transparent; color: var(--accent); padding: 9px 13px; cursor: pointer; white-space: nowrap; }
    .service-action:hover { background: var(--accent-soft); }
    .agent-section { margin-top: 22px; }
    .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 12px; }
    .agent-card { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 14px; }
    .agent-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .agent-card-title { font-weight: 680; }
    .agent-tier { color: var(--muted); font-size: 11px; }
    .agent-adapter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .agent-adapter span { border-radius: 999px; background: var(--surface-2); padding: 4px 7px; color: var(--muted); font-size: 10px; }
    .agent-layers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-top: 11px; }
    .agent-layer { min-width: 0; border-top: 3px solid var(--border); padding-top: 6px; color: var(--muted); font-size: 10px; }
    .agent-layer[data-status="verified"] { border-color: var(--success); color: var(--text); }
    .agent-layer[data-status="configured"] { border-color: var(--warning); color: var(--text); }
    .agent-layer[data-status="blocked"] { border-color: var(--danger); color: var(--danger); }
    .agent-layer-label, .agent-layer-state { display: block; overflow-wrap: anywhere; }
    .agent-layer-state { margin-top: 3px; font-size: 9px; }
    .agent-evidence { margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .goal-card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 20px; margin: 20px 0; }
    .goal-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    .goal-text { margin: 7px 0 0; max-width: 900px; font-size: clamp(17px, 2.2vw, 23px); line-height: 1.45; font-weight: 620; }
    .progress-line { display: flex; justify-content: space-between; gap: 14px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .progress-track { height: 7px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
    .section-card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 17px; }
    .section-card h2 { margin: 0; font-size: 18px; }
    .section-help { margin: 5px 0 15px; color: var(--muted); font-size: 13px; }
    .attention-list { display: grid; gap: 8px; margin-top: 12px; }
    .attention-item { border-left: 3px solid var(--warning); border-radius: 8px; background: var(--surface-2); padding: 10px 12px; font-size: 13px; }
    .attention-item.error { border-left-color: var(--danger); color: var(--text); }
    .role-chip, .material-chip { display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-2); padding: 5px 9px; color: var(--muted); font-size: 12px; }
    .detail-section { margin-top: 17px; }
    .detail-section h3 { margin: 0 0 7px; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    .detail-section p { margin: 5px 0; line-height: 1.45; }
    .material-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .material-button { border: 1px solid var(--border); cursor: pointer; color: var(--text); }
    .material-button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .project-goal-source { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .version-focus { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
    .version-name { font-size: 13px; color: var(--muted); }
    .version-goal { margin: 5px 0 0; font-size: 15px; line-height: 1.5; font-weight: 580; }
    .version-progress { text-align: right; white-space: nowrap; }
    .version-progress strong { display: block; font-size: 22px; }
    .version-progress span { color: var(--muted); font-size: 12px; }
    .office-shell { margin-top: 18px; }
    .office-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; }
    .flow-line { display: flex; align-items: center; gap: 8px; min-height: 36px; border-left: 3px solid var(--accent); background: var(--surface-soft); padding: 7px 10px; }
    .flow-line[data-kind="suggested"] { border-style: dashed; }
    .flow-line[data-kind="suggested"] .flow-arrow { background: transparent; border-top: 2px dashed var(--accent); }
    .flow-kind { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .flow-role { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .flow-arrow { position: relative; flex: none; width: 28px; height: 2px; background: var(--accent); overflow: visible; }
    .flow-arrow::after { content: ""; position: absolute; right: -1px; top: -3.5px; border: 4.5px solid transparent; border-left-color: var(--accent); }
    .flow-arrow::before { content: ""; position: absolute; left: 0; top: -2.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: flow-dot 1.4s linear infinite; }
    @keyframes flow-dot { to { transform: translateX(22px); opacity: 0; } }
    .role-office-scroll { overflow-x: auto; overflow-y: visible; padding: 54px 0 10px; margin-top: -40px; }
    .role-office-scene { min-width: 720px; display: grid; grid-template-columns: repeat(5, minmax(118px, 1fr)); gap: 10px; margin-top: 14px; padding: 34px 10px 18px; overflow: visible; border: 0; background: transparent; }
    .role-station { position: relative; z-index: 1; display: grid; grid-template-rows: 128px minmax(48px, auto); gap: 8px; min-width: 0; min-height: 184px; border: 0; border-radius: 14px; background: transparent; color: inherit; padding: 4px; cursor: pointer; text-align: center; transition: transform .18s ease, background .18s ease; }
    .role-station:hover, .role-station:focus-visible, .role-station[aria-pressed="true"] { z-index: 4; transform: translateY(-3px); background: color-mix(in srgb, var(--surface-2) 48%, transparent); }
    .role-station[data-status="idle"], .role-station[data-status="missing"] { opacity: .58; }
    .role-visual { position: relative; min-width: 0; height: 128px; }
    .role-jelly { position: absolute; z-index: 2; left: 50%; bottom: 5px; width: 106px; height: 108px; transform: translateX(-50%); transform-origin: 50% 100%; border: 0; border-radius: 53% 47% 44% 43% / 56% 53% 43% 40%; background: var(--jelly-color); --jelly-color: #58a7f7; }
    .role-jelly[data-flavor="planner"] { --jelly-color: #58a7f7; }
    .role-jelly[data-flavor="creative"] { --jelly-color: #ffa266; }
    .role-jelly[data-flavor="builder"] { --jelly-color: #7bd08c; }
    .role-jelly[data-flavor="inspector"] { --jelly-color: #eb84b9; }
    .role-jelly[data-flavor="reviewer"] { --jelly-color: #9e83e8; }
    .jelly-face { position: absolute; z-index: 3; left: 25px; right: 25px; top: 43px; height: 12px; }
    .jelly-face::before, .jelly-face::after { content: ""; position: absolute; top: 0; width: 9px; height: 11px; border-radius: 50%; background: #17191d; }
    .jelly-face::before { left: 3px; } .jelly-face::after { right: 3px; }
    .jelly-arm { position: absolute; z-index: 1; right: -17px; top: 58px; width: 31px; height: 17px; border-radius: 999px; background: var(--jelly-color); transform: rotate(8deg); transform-origin: 4px 50%; }
    .jelly-task { position: absolute; z-index: 4; right: -19px; top: 54px; width: 35px; height: 43px; border: 4px solid var(--jelly-color); border-radius: 7px; background: var(--surface); color: transparent; font-size: 0; transform: rotate(-5deg); transform-origin: 50% 50%; }
    .role-station[data-status="active"] .role-jelly { animation: jelly-active 1.25s ease-in-out infinite; }
    .role-station[data-status="active"] .jelly-arm, .role-station[data-status="active"] .jelly-task { animation: jelly-carry 1.25s ease-in-out infinite; }
    @keyframes jelly-active { 0%, 100% { transform: translate(-50%, -16px) scale(1); } 42% { transform: translate(-50%, -10px) scale(1.06, .94); } 68% { transform: translate(-50%, -22px) scale(.97, 1.05); } }
    @keyframes jelly-carry { 0%, 100% { rotate: 0deg; translate: 0 0; } 50% { rotate: 6deg; translate: 2px -5px; } }
    .role-card-meta { align-self: stretch; display: grid; place-items: start center; min-width: 0; min-height: 48px; padding: 0 4px; }
    .role-name { min-width: 0; max-width: 150px; font-size: clamp(19px, 1.55vw, 24px); font-weight: 520; line-height: 1.35; overflow-wrap: anywhere; text-align: center; }
    .role-hover-card { position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 6; width: min(220px, calc(100vw - 40px)); transform: translate(-50%, 6px); visibility: hidden; opacity: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 12px 34px color-mix(in srgb, var(--code-bg) 24%, transparent); padding: 10px 12px; text-align: left; pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
    .role-hover-card strong, .role-hover-card span { display: block; }
    .role-hover-card span { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .role-station:hover .role-hover-card, .role-station:focus-visible .role-hover-card { visibility: visible; opacity: 1; transform: translate(-50%, 0); }
    .transition-trail { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .transition-pill { border-radius: 999px; background: var(--surface-2); padding: 5px 9px; color: var(--muted); font-size: 11px; }
    .transition-pill[data-current="true"] { background: var(--accent-soft); color: var(--text); }
    .project-overview-hero { margin-top: 22px; border-top: 3px solid var(--accent); border-bottom: 1px solid var(--border); background: var(--surface); }
    .overview-hero-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, .7fr); }
    .overview-story { padding: clamp(20px, 3vw, 34px); }
    .version-kicker { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .overview-version-goal { margin: 9px 0 0; max-width: 820px; font-size: clamp(21px, 2.5vw, 30px); font-weight: 660; line-height: 1.32; }
    .overview-progress { margin-top: 24px; max-width: 720px; }
    .overview-status-strip { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .overview-status-item strong { margin-left: 5px; color: var(--text); font-size: 13px; }
    .overview-command { display: grid; align-content: center; gap: 18px; padding: clamp(20px, 3vw, 30px); border-left: 1px solid var(--border); background: var(--surface-soft); }
    .command-item { display: grid; gap: 5px; }
    .command-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .command-value { font-size: 15px; font-weight: 650; line-height: 1.4; }
    .command-value[data-alert="true"] { color: var(--danger); }
    .current-version-requirements { margin-top: 20px; }
    .requirement-command-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .requirement-command-head h2 { margin: 0; font-size: 20px; }
    .requirement-command-summary { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .requirement-card-list { display: grid; gap: 10px; margin-top: 14px; }
    .current-requirement-card { width: 100%; min-width: 0; overflow: visible; border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 12px; background: var(--surface); color: inherit; }
    .requirement-summary-button { width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(210px, .85fr) minmax(230px, .8fr) minmax(220px, 1fr); gap: 18px; align-items: start; border: 0; border-radius: inherit; background: transparent; color: inherit; padding: 15px 16px; text-align: left; cursor: pointer; }
    .requirement-summary-button:hover, .requirement-summary-button:focus-visible { background: color-mix(in srgb, var(--accent-soft) 48%, transparent); }
    .current-requirement-card[data-selected="true"] { border-left-color: var(--accent); background: var(--accent-soft); }
    .current-requirement-card[data-status="completed"] { border-left-color: var(--success); }
    .current-requirement-card[data-status="blocked"] { border-left-color: var(--danger); }
    .requirement-identity { min-width: 0; }
    .requirement-id { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .requirement-title { display: block; margin-top: 5px; font-size: 16px; font-weight: 680; line-height: 1.4; overflow-wrap: anywhere; }
    .requirement-state { display: inline-flex; margin-top: 9px; border-radius: 999px; background: var(--surface-2); padding: 4px 8px; color: var(--muted); font-size: 11px; }
    .requirement-state[data-status="in_progress"] { color: var(--accent); }
    .requirement-state[data-status="completed"] { color: var(--success); }

<body>
  <div class="app">
    <aside class="sidebar" aria-label="项目导航">
      <p class="brand">Harness 项目导航</p>
      <p id="portfolio-summary" class="subtitle">正在整理项目…</p>
      <nav id="nav-tree" class="nav-tree" aria-label="项目与视图"></nav>
    </aside>
    <main class="main">
      <div id="content" aria-live="polite">
        <div class="empty">正在整理项目进展…</div>
      </div>
    </main>
  </div>
  <script>
    (() => {
      const state = { portfolio: null, agents: null, skills: null, skillFilter: "attention", operations: null, brainHealth: null, brainCandidates: [], projectMemories: [], harnessImprovements: [], brainSyncConfirm: false, brainSyncPreview: null, focus: null, project: null, index: null, run: null, snapshot: null, workspace: null, events: [], view: "overview", taskId: null, selectedRole: null, removeProjectId: null, artifactPath: null, artifactDocument: null, artifactError: null, notice: null };
      const navTree = document.getElementById("nav-tree");
      const portfolioSummary = document.getElementById("portfolio-summary");
      const content = document.getElementById("content");
      const networkRetryDelaysMs = [0, 300, 900];
      const OPERATION_FALLBACKS = [
        { action: "harness-update", label: "更新 Harness", description: "刷新已发布版本和所有已登记项目。" },
        { action: "project-init", label: "注入或升级项目", description: "将一个本机项目接入统一工作台。" },
        { action: "agent-sync", label: "修复 Agent 接入", description: "重新同步 Agent 加载器与 Hook。" },
        { action: "command-plan", group: "command", label: "建立 Plan", description: "扫描项目并建立计划档案。" },
        { action: "command-goal", group: "command", label: "维护长期目标", description: "维护面向人类的长期项目目标。" },
        { action: "command-brain", group: "command", label: "配置 Brain", description: "选择本机、私有远端或暂不启用。" },
        { action: "command-e2e", group: "command", label: "推进单条需求", description: "按真实门禁推进一条需求。" }
      ];
      let operationPollTimer = null;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function fetchWithRetry(url) {
        let lastError = null;
        for (const delayMs of networkRetryDelaysMs) {
          if (delayMs) await wait(delayMs);
          try {
            return await fetch(url, { cache: "no-store" });
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError;
      }

      async function fetchJson(url) {
        const response = await fetchWithRetry(url);
        if (!response.ok) throw new Error(`${url} returned ${response.status}`);
        return response.json();
      }

      async function postBrain(url, body = {}) {
        const response = await fetch(url, {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Harness-Action-Token": state.brainHealth?.action_token || ""
          },
          body: JSON.stringify(body)
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `${url} returned ${response.status}`);
        return value;
      }

      async function postOperation(url, body = {}) {
        const response = await fetch(url, {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Harness-Action-Token": state.operations?.action_token || ""
          },
          body: JSON.stringify(body)
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `${url} returned ${response.status}`);
        return value;
      }

      async function unregisterProject(projectId) {
        const response = await fetch(`/api/projects/${encodeURIComponent(projectId)}/unregister`, {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Harness-Action-Token": state.operations?.action_token || ""
          },
          body: JSON.stringify({ confirmed: true })
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `project-unregister returned ${response.status}`);
        state.removeProjectId = null;
        state.notice = `${value.name} 已移出工作台；不会删除项目文件。`;
        state.portfolio = await fetchJson("/api/portfolio.json");
        if (state.project?.project_id === projectId) await selectProject(null);
        else render();
      }

      function operationStatusLabel(status) {
        return ({ prepared: "等待确认", queued: "等待执行", running: "正在执行", succeeded: "已完成", blocked: "已安全停止", cancelled: "已取消", failed: "失败" })[status] || status || "未知";
      }

      async function refreshOperations() {
        const previous = state.operations?.active?.operation_id || null;
        state.operations = await fetchJson("/api/operations.json");
        const active = state.operations.active;
        if (operationPollTimer) clearTimeout(operationPollTimer);
        operationPollTimer = null;
        if (active) {
          operationPollTimer = setTimeout(async () => {
            try {
              await refreshOperations();
              render();
            } catch (error) {
              state.notice = `操作状态刷新失败：${error.message}`;
              render();
            }
          }, 1000);
        } else if (previous) {
          const latest = state.operations.items?.[0];
          if (latest) state.notice = latest.summary || `${latest.label}：${operationStatusLabel(latest.status)}`;
          [state.portfolio, state.agents] = await Promise.all([
            fetchJson("/api/portfolio.json"),
            fetchJson("/api/agents.json")
          ]);
        }
        return state.operations;
      }

      async function startHarnessOperation(item) {
        try {
          let parameters = {};
          const projectOptions = (state.portfolio?.projects || [])
            .filter(project => project.validation === "valid" && project.path)
            .map(project => ({ value: project.path, label: project.name }));
          if (item.action === "project-init") {
            const values = await brainDialog({
              title: "注入或升级项目",
              description: "填写项目文件夹的绝对路径。预检只读取目录状态，不会立即写入。",
              confirmLabel: "生成确认单",
              fields: [
                { name: "project_path", label: "项目文件夹", required: true, placeholder: "/Users/you/project" },
                { name: "mode", label: "注入范围", type: "select", options: [
                  { value: "standard", label: "标准规则（推荐）" },
                  { value: "full", label: "完整检查（含 Brain）" }
                ] }
              ]
            });
            if (!values) return;
            parameters = { project_path: values.project_path, full: values.mode === "full" };
          } else if (["command-plan", "command-goal", "command-e2e"].includes(item.action)) {
            if (!projectOptions.length) {
              state.notice = "当前没有可执行命令的已连接项目；请先注入或修复项目连接。";
              render();
              return;
            }
            const fields = [{ name: "project_path", label: "项目", type: "select", options: projectOptions }];
            if (item.action === "command-plan") fields.push({ name: "title", label: "阶段标题（可选）", placeholder: "例如：0.21 命令工作台" });
            if (item.action === "command-goal") fields.push({ name: "goal", label: "长期产品目标", type: "textarea", required: true, placeholder: "描述长期为谁解决什么问题，不写版本、任务或技术方案" });
            if (item.action === "command-e2e") fields.push({ name: "requirement_id", label: "需求 ID", required: true, placeholder: "例如 task-201" });
            const values = await brainDialog({
              title: item.label,
              description: "先生成只读预览；不会在这一步写项目文件或推进需求。",
              confirmLabel: "生成确认单",
              fields
            });
            if (!values) return;
            parameters = values;
          } else if (item.action === "command-brain") {
            const values = await brainDialog({
              title: "配置 Brain",
              description: "配置只决定模式和目标位置；不会自动创建、删除或同步 Brain 数据。远端地址不得包含凭据。",
              confirmLabel: "生成确认单",
              fields: [
                { name: "mode", label: "连接模式", type: "select", options: [
                  { value: "local", label: "仅保存在本机" },
                  { value: "remote", label: "连接私有远端" },
                  { value: "disabled", label: "暂不启用" }
                ] },
                { name: "local_path", label: "本地位置（可选）", placeholder: "/Users/you/.brain" },
                { name: "remote", label: "私有 Git 地址（远端模式必填）", placeholder: "https://github.com/you/private-brain.git" }
              ]
            });
            if (!values) return;
            parameters = values;
          }
          const preview = await postOperation("/api/operations/preview", { action: item.action, parameters });
          if (!preview.can_execute) {
            state.notice = `无法执行：${preview.summary || "预检未通过；未发生写入。"}`;
            await refreshOperations();
            render();
            return;
          }
          const effectText = (preview.effects || []).map(value => `• ${value}`).join("\n");
          const previewText = preview.preview ? `\n\n命令预览：\n${preview.preview}` : "";
          const dataBoundary = preview.reads || preview.writes
            ? `\n\n读取：${preview.reads || "仅预检所需本机状态"}\n写入：${preview.writes || "见上方影响清单"}\n确认：必须由你在本页确认后才执行`
            : "";
          const confirmation = await brainDialog({
            title: preview.confirmation || preview.label,
            description: `目标：${preview.target}\n\n将发生：\n${effectText}${dataBoundary}${previewText}\n\n恢复：${preview.recovery}`,
            confirmLabel: "确认执行"
          });
          if (!confirmation) {
            await postOperation(`/api/operations/${encodeURIComponent(preview.operation_id)}/cancel`, {
              confirmation_token: preview.confirmation_token
            });
            state.notice = `${preview.label}已取消，未执行项目或全局配置写入。`;
            await refreshOperations();
            render();
            return;
          }
          await postOperation(`/api/operations/${encodeURIComponent(preview.operation_id)}/execute`, {
            confirmation_token: preview.confirmation_token
          });
          state.notice = `${preview.label}已进入后台执行；离开页面不会中断任务。`;
          await refreshOperations();
          render();
        } catch (error) {
          state.notice = `Harness 操作失败：${error.message}`;
          render();
        }
      }

      function brainDialog({ title, description, confirmLabel = "确认", danger = false, fields = [] }) {
        return new Promise(resolve => {
          const backdrop = el("div", "brain-dialog-backdrop");
          const dialog = el("section", "brain-dialog");
          dialog.setAttribute("role", "dialog");
          dialog.setAttribute("aria-modal", "true");
          dialog.setAttribute("aria-labelledby", "brain-dialog-title");
          const form = el("form", "brain-dialog-form");
          const heading = el("h2", "", title);
          heading.id = "brain-dialog-title";
          form.append(heading);
          if (description) form.append(el("p", "brain-dialog-description", description));
          const fieldWrap = el("div", "brain-dialog-fields");
          const controls = new Map();
          fields.forEach(field => {
            const label = el("label", "brain-dialog-field", field.label);
            let control;
            if (field.type === "select") {
              control = el("select", "");
              (field.options || []).forEach(option => {
                const node = el("option", "", option.label || option.value);
                node.value = option.value;
                control.append(node);
              });
            } else if (field.type === "textarea") {
              control = el("textarea", "");
            } else {
              control = el("input", "");
              control.type = field.type || "text";
            }
            control.name = field.name;
            const initialValue = field.value ?? (
              field.type === "select" ? (field.options?.[0]?.value ?? "") : ""
            );
            control.value = initialValue;
            control.required = Boolean(field.required);
            if (field.placeholder) control.placeholder = field.placeholder;
            label.append(control);
            fieldWrap.append(label);
            controls.set(field.name, control);
          });
          if (fields.length) form.append(fieldWrap);
          const actions = el("div", "brain-dialog-actions");
          const cancel = el("button", "brain-dialog-cancel", "取消");
          cancel.type = "button";
          const submit = el("button", "brain-dialog-submit", confirmLabel);
          submit.type = "submit";
          submit.dataset.danger = String(danger);
          actions.append(cancel, submit); form.append(actions); dialog.append(form); backdrop.append(dialog);

          const close = value => {
            document.removeEventListener("keydown", onKeydown);
            backdrop.remove();
            resolve(value);
          };
          const onKeydown = event => {
            if (event.key === "Escape") close(null);
          };
          cancel.addEventListener("click", () => close(null));
          backdrop.addEventListener("click", event => { if (event.target === backdrop) close(null); });
          form.addEventListener("submit", event => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            close(Object.fromEntries(Array.from(controls, ([name, control]) => [name, control.value.trim()])));
          });
          document.addEventListener("keydown", onKeydown);
          document.body.append(backdrop);
          (controls.values().next().value || submit).focus();
        });
      }

      async function fetchEvents(projectId, runId) {
        const response = await fetchWithRetry(`/api/projects/${encodeURIComponent(projectId)}/runs/${encodeURIComponent(runId)}/events.jsonl`);
        if (!response.ok) throw new Error(`events returned ${response.status}`);
        const text = await response.text();
        return text.split("\n").filter(Boolean).map(line => JSON.parse(line));
      }

      function readUrlState() {
        const params = new URLSearchParams(location.search);
        const rawView = params.get("view");
        state.view = ALL_VIEWS.includes(rawView) ? rawView : "workbench";
        state.taskId = params.get("task");
        state.selectedRole = params.get("role");
        state.artifactPath = params.get("artifact");
        state.focus = params.get("focus");
        return { projectId: params.get("project"), runId: params.get("run") };
      }

      function writeUrlState() {
        const params = new URLSearchParams();
        if (state.project) params.set("project", state.project.project_id);
        if (state.run) params.set("run", state.run.run_id);
        params.set("view", state.view);
        if (state.taskId) params.set("task", state.taskId);
        if (state.selectedRole) params.set("role", state.selectedRole);
        if (state.artifactPath) params.set("artifact", state.artifactPath);
        if (state.focus) params.set("focus", state.focus);
        history.replaceState(null, "", `?${params.toString()}`);
      }

      function summaryForEvent(event) {
        const payload = event.payload || {};

      }

      function compactText(value, fallback = "尚未回写可读说明") {

      function renderBrain() {
        content.replaceChildren();
        const health = state.brainHealth || {};
        const repository = health.repository || {};
        const pendingSync = Number(health.remote_sync?.pending_local_records || 0);
        const brainMode = repository.mode || "disabled";
        const repositoryEffective = brainMode === "disabled" || (brainMode === "local" ? Boolean(repository.git) : Boolean(repository.git && repository.remote_matches_config));
        const canSyncRemote = brainMode === "remote" && Boolean(repository.git && repository.remote_matches_config);
        const top = el("div", "topline");
        const titleWrap = el("div", "");
        titleWrap.append(el("div", "eyebrow", "设置 · 本机记忆服务"), el("h1", "", "记忆与同步"));
        top.append(titleWrap, el("div", "freshness", health.generated_at || "尚未读取"));
        content.append(top);
        const back = el("button", "service-action", "← 返回工作台");
        back.type = "button";
        back.addEventListener("click", () => { state.view = "workbench"; state.focus = null; selectProject(null); });
        content.append(back);
        renderSettingsTabs("memory");
        content.append(el("p", "section-help", "本机服务自动记录已确认的工作事实；Hook 只负责采集事件，Prompt 只辅助识别含义，关闭会话不是写入前提。远端发送前，先核对这一次具体会上传什么。"));
        if (state.notice) content.append(el("p", "warning-line", state.notice));

        const stack = el("div", "brain-stack");

        const sync = el("section", "brain-card");
        sync.id = "brain-sync";
        sync.tabIndex = -1;
        const syncOverview = el("div", "brain-sync-overview");
        const syncCopy = el("div", "");
        syncCopy.append(el("h2", "", "本次同步清单"));
        syncCopy.append(el("p", "section-help", "先由本机后端读取真实 Git 状态并生成清单；查看清单不会上传、提交或修改任何文件。"));
        const syncStatus = el("div", "brain-sync-status");
        syncStatus.append(
          el("span", "", `本地写入 · ${health.local_write?.status || "未知"}`),
          el("span", "", `项目记录待同步 · ${pendingSync}`),
          el("span", "", `远端同步 · ${health.remote_sync?.status || "未知"}`)
        );
        syncCopy.append(syncStatus);
        const previewButton = el("button", "brain-sync-button", state.brainSyncPreview ? "重新读取清单" : "查看同步清单");

                summary: values.summary,

          if (candidate.status === "observed") {
            actions.append(improvementButton(candidate.eligible_for_approval ? "进入审批" : "仍然送审", async () => {
              const values = await brainDialog({
                title: candidate.eligible_for_approval ? "提交 Harness 审批" : "单项目信号仍然送审？",
                description: candidate.eligible_for_approval ? "频次已达到送审条件，但仍不会自动改规则。" : "这条问题尚未跨项目重复；确认后只进入人工审批，不会直接生效。",

          if (candidate.status === "pending_approval") {
            actions.append(improvementButton(`批准为 ${improvementTargetLabel(candidate.target)} 提案`, async () => {
              const values = await brainDialog({
                title: `批准 ${improvementTargetLabel(candidate.target)} 提案`,
                description: "批准后只生成本地、可审计的提案文件；不会修改中央 Harness。",
                confirmLabel: "批准并生成提案",
              });
              if (!values) return;
              await postBrain(`/api/harness/improvements/${encodeURIComponent(candidate.improvement_id)}/approve`, {});

          }
          if (["observed", "pending_approval"].includes(candidate.status)) {
            actions.append(improvementButton("拒绝", async () => {
              const values = await brainDialog({ title: "拒绝改进候选", description: "候选会保留拒绝状态，原项目记录不受影响。", confirmLabel: "确认拒绝", danger: true });
              if (!values) return;
              await postBrain(`/api/harness/improvements/${encodeURIComponent(candidate.improvement_id)}/reject`, {});
            }, "danger"));
          }
          if (candidate.status === "approved") {
            actions.append(improvementButton("登记已落地", async () => {
              const values = await brainDialog({
                title: "登记实际落地产物",
                description: "只有真实 Rule、Skill、Checker 或 Profile 文件完成并验证后才登记。",
                confirmLabel: "登记落地",
                fields: [
                  { name: "artifact_path", label: "项目相对路径", required: true, placeholder: "verify.d/ui-layout.py" },
                  { name: "baseline_count", label: "落地前同类问题次数", type: "number", value: String(candidate.occurrence_count || 0), required: true },
                ],
              });
              if (!values) return;
              await postBrain(`/api/harness/improvements/${encodeURIComponent(candidate.improvement_id)}/mark-implemented`, {
                artifact_path: values.artifact_path,
                baseline_count: Number(values.baseline_count),
              });
            }, "primary"));
          }
          if (["implemented", "needs_followup"].includes(candidate.status)) {
            actions.append(improvementButton("记录效果复验", async () => {
              const values = await brainDialog({
                title: "记录效果复验",
                description: "以同类问题频次是否下降为判断，不用“文件已改”代替效果证据。",
                confirmLabel: "保存复验",
                fields: [
                  { name: "result", label: "结果", type: "select", options: [

                    { value: "unchanged", label: "unchanged · 无变化" },
                    { value: "regressed", label: "regressed · 变差" },
                  ] },
                  { name: "current_count", label: "当前同类问题次数", type: "number", value: "0", required: true },
                  { name: "note", label: "复验证据", type: "textarea", placeholder: "项目、窗口和验证结论" },
                ],
              });
              if (!values) return;
              await postBrain(`/api/harness/improvements/${encodeURIComponent(candidate.improvement_id)}/verify-effect`, {
                result: values.result,
                current_count: Number(values.current_count),
                note: values.note,
              });

          }

      function renderAgents(container) {
        const agentSection = el("section", "section-card agent-section");
        agentSection.append(el("h2", "", "Code Agent 接入状态"));
        agentSection.append(el("p", "section-help", "五层状态分开验证；装好规则或 Hook 不等于当前会话已经加载。"));
        const agentGrid = el("div", "agent-grid");
        const layerLabels = { discovered: "发现", injected: "注入", loaded: "加载", execution: "遵循", feedback: "回写" };
        const layerStates = { verified: "已验证", configured: "待真实会话", unverified: "未验证", not_detected: "未发现", blocked: "有冲突" };
        const adapterStates = { managed: "自动管理", manual: "手动接入", unsupported: "暂不支持" };
        (state.agents?.agents || []).forEach(agent => {
          const card = el("article", "agent-card");
          const head = el("div", "agent-card-head");
          head.append(el("span", "agent-card-title", agent.name), el("span", "agent-tier", `Tier ${agent.tier}`));
          card.append(head);
          const adapter = agent.adapter || {};
          const adapterMeta = el("div", "agent-adapter");
          adapterMeta.append(
            el("span", "", `规则 ${adapterStates[adapter.loading] || "未声明"}`),
            el("span", "", `Skill ${adapterStates[adapter.skills] || "未声明"}`),
            el("span", "", `Hook ${adapterStates[adapter.hooks] || "未声明"}`),
          );
          card.append(adapterMeta);
          const layers = el("div", "agent-layers");
          Object.entries(layerLabels).forEach(([key, label]) => {
            const layer = el("div", "agent-layer");
            const status = agent.layers?.[key]?.status || "unverified";
            layer.dataset.status = status;
            layer.append(el("span", "agent-layer-label", label), el("span", "agent-layer-state", layerStates[status] || status));
            layers.append(layer);
          });
          card.append(layers);
          const evidence = agent.evidence || {};
          const evidenceProjects = (evidence.projects || []).join("、");
          card.append(el("div", "agent-evidence", evidence.event_count ? `${evidence.event_count} 条回写证据${evidenceProjects ? ` · ${evidenceProjects}` : ""}` : "尚无真实会话证据"));
          agentGrid.append(card);
        });
        if (!agentGrid.childElementCount) agentGrid.append(el("div", "empty", "尚未取得 Agent 检测结果。"));
        agentSection.append(agentGrid);
        container.append(agentSection);
      }

      function renderRuns(container) {
        const runs = state.index?.runs || [];
        const section = el("section", "section-card");
        section.append(el("h2", "", "原始运行"));
        section.append(el("p", "section-help", "每次观察运行对应一组快照与事件；选择运行回到该时间点。"));
        if (!runs.length) {
          section.append(el("div", "empty", "这个项目还没有原始运行记录。"));
          container.append(section);
          return;
        }
        const list = el("div", "runs-list");
        runs.forEach(run => {
          const button = el("button", "runs-row");
          button.type = "button";
          button.dataset.current = String(state.run?.run_id === run.run_id);
          const head = el("div", "runs-row-head");
          head.append(el("span", "", run.name || run.run_id), el("span", "muted", run.status || "observing"));
          button.append(head);
          const meta = el("div", "runs-row-meta");
          meta.append(el("span", "muted", run.run_id));
          if (run.updated_at) meta.append(el("span", "muted", new Date(run.updated_at).toLocaleString()));
          if (run.last_sequence != null) meta.append(el("span", "muted", `seq ${run.last_sequence}`));
          button.append(meta);
          button.addEventListener("click", () => selectRun(run.run_id));
          list.append(button);
        });
        section.append(list);
        container.append(section);
      }

      function renderSkills() {
        content.replaceChildren();
        const skills = state.skills || { summary: {}, items: [], boundaries: {} };
        const summary = skills.summary || {};
        const top = el("div", "topline");
        const titleWrap = el("div", "");
        titleWrap.append(el("div", "eyebrow", "设置 · 本机能力治理"), el("h1", "", "能力与 Skill"));
        top.append(titleWrap, el("div", "freshness", `更新于 ${formattedTime(skills.generated_at)}`));
        content.append(top);
        const back = el("button", "service-action", "← 返回工作台");
        back.type = "button";
        back.addEventListener("click", () => { state.view = "workbench"; state.focus = null; selectProject(null); });
        content.append(back);
        renderSettingsTabs("skills");
        content.append(el("p", "section-help", "这里管理 Skill 的来源与边界。外部 Skill 是角色的方法附件，不会成为新的角色，也不能接管 Harness 的权限、Hook、记忆或完成标准。"));

        const boundary = el("div", "skill-boundary", "当前为只读治理：发现本机 Skill、检查兼容性和展示角色归属；不会联网下载、执行第三方脚本或修改现有 Agent 配置。静态通过也不等于 Agent 已在真实任务中加载。");
        content.append(boundary);

        const summaryGrid = el("section", "skill-summary");
        [["已发现", summary.discovered || 0], ["已分配角色", summary.assigned || 0], ["需人工审查", summary.review_required || 0], ["已验证加载", summary.verified_loaded || 0]].forEach(([label, value]) => {
          const item = el("div", "skill-summary-item");
          item.append(el("span", "", label), el("strong", "", value));
          summaryGrid.append(item);
        });
        content.append(summaryGrid);

        const toolbar = el("div", "skill-toolbar");
        const filters = el("div", "skill-filters");
        const filterLabels = [
          ["attention", `需关注 ${(summary.review_required || 0) + (summary.blocked || 0)}`],
          ["all", `全部 ${summary.discovered || 0}`],
          ["compatible", `可兼容 ${summary.compatible || 0}`],
          ["review_required", `需审查 ${summary.review_required || 0}`],
          ["blocked", `已阻断 ${summary.blocked || 0}`]
        ];
        filterLabels.forEach(([value, label]) => {
          const button = el("button", "skill-filter", label);
          button.type = "button";
          button.setAttribute("aria-pressed", String(state.skillFilter === value));
          button.addEventListener("click", () => { state.skillFilter = value; renderSkills(); });
          filters.append(button);
        });
        toolbar.append(filters);
        const refresh = el("button", "service-action", "重新扫描");
        refresh.type = "button";
        refresh.addEventListener("click", async () => {
          refresh.disabled = true;
          try {
            state.skills = await fetchJson("/api/skills.json");
            state.notice = "已重新读取本机 Skill；没有执行或修改任何 Skill。";
          } catch (error) {
            state.notice = `Skill 扫描失败：${error.message}`;
          }
          renderSkills();
        });
        toolbar.append(refresh);
        content.append(toolbar);
        if (state.notice) content.append(el("p", "warning-line", state.notice));

        const sourceLabels = {
          harness_builtin: "Harness 内置", codex_system: "Codex 系统", codex_external: "Codex 外部",
          claude_external: "Claude 外部", agent_external: "通用 Agent", codex_plugin: "Codex 插件", project_skill: "项目专用"
        };
        const statusLabels = { compatible: "可兼容", review_required: "需要审查", blocked: "禁止接入" };
        const visible = (skills.items || []).filter(item => state.skillFilter === "all" || (state.skillFilter === "attention" ? item.compatibility?.status !== "compatible" : item.compatibility?.status === state.skillFilter));
        const list = el("section", "skill-list");
        if (!visible.length) {
          list.append(el("div", "skill-empty", "当前筛选下没有 Skill。"));
        }
        visible.forEach(item => {
          const row = el("article", "skill-item");
          const head = el("div", "skill-item-head");
          const title = el("div", "skill-title");
          title.append(el("strong", "", item.name), el("span", "skill-path", `${sourceLabels[item.source] || item.source} · ${item.path}`));
          head.append(title, el("div", "skill-description", item.description));
          const compatibility = item.compatibility || { status: "review_required", findings: [] };
          const badge = el("span", "skill-status", statusLabels[compatibility.status] || compatibility.status);
          badge.dataset.status = compatibility.status;
          head.append(badge); row.append(head);

          const facts = el("div", "skill-facts");
          const factValues = [
            ["文件", item.installation_status === "installed" ? "已安装" : "未安装"],
            ["角色", item.roles?.length ? item.roles.map(roleLabel).join("、") : "尚未分配"],
            ["加载", item.load_status === "verified" ? "真实任务已验证" : "尚无运行证据"],
            ["范围", item.scope === "project" ? "项目" : item.scope === "harness" ? "Harness" : "本机全局"]
          ];
          factValues.forEach(([label, value]) => {
            const fact = el("div", "skill-fact");
            fact.append(el("span", "", label), el("strong", "", value));
            facts.append(fact);
          });
          row.append(facts);

          const details = el("details", "skill-detail");
          const findings = compatibility.findings || [];
          details.append(el("summary", "", findings.length ? `查看 ${findings.length} 项诊断` : "查看能力边界"));
          if (!findings.length) {
            details.append(el("p", "muted", "未发现静态冲突。仍需在分配角色后通过真实任务证明 Agent 已加载并遵循。"));
          } else {
            findings.forEach(finding => {
              const findingRow = el("div", "skill-finding");
              findingRow.append(el("strong", "", finding.code), el("span", "", `${finding.summary}${finding.line ? ` · SKILL.md 第 ${finding.line} 行` : ""}`));
              details.append(findingRow);
            });
          }
          const resources = item.resources || {};
          const resourceCount = Object.values(resources).reduce((sum, values) => sum + values.length, 0);
          if (resourceCount) details.append(el("p", "muted", `资源：${Object.entries(resources).map(([kind, values]) => `${kind} ${values.length}`).join(" · ")}；这里只读取文件名。`));
          row.append(details); list.append(row);
        });
        content.append(list);
      }

      function renderSettings() {
        if (state.focus === "skills") renderSkills();
        else if (state.focus === "improvements") renderImprovements();
        else renderBrain();
      }

      function renderPortfolio() {
        content.replaceChildren();
        const projects = state.portfolio?.projects || [];
        const summary = state.portfolio?.summary || {};
        const validProjects = projects.filter(item => item.validation === "valid");
        const invalidProjects = projects.filter(item => item.validation !== "valid");
        const brainHealth = state.brainHealth || {};
        const localStatus = brainHealth.local_write?.status || "unavailable";
        const pendingSync = brainHealth.remote_sync?.pending_local_records || 0;
        const pendingApproval = brainHealth.approval_inbox?.pending || 0;
        const pendingBlocks = summary.active_blocks || 0;
        const pendingVerify = validProjects.reduce((sum, project) => sum + (project.summary?.verification_pending || 0), 0);
        const inboxTotal = pendingBlocks + pendingVerify + pendingApproval + pendingSync + invalidProjects.length;

        const top = el("div", "topline");
        const titleWrap = el("div", "");
        titleWrap.append(el("div", "eyebrow", "个人工作指挥台"));
        titleWrap.append(el("h1", "", "工作台"));
        top.append(titleWrap, el("div", "freshness", `更新于 ${formattedTime(state.portfolio?.generated_at)}`));
        content.append(top);
        if (state.notice) content.append(el("p", "warning-line", state.notice));

        const inboxCard = el("section", "workbench-priority");
        const inboxHead = el("div", "inbox-head");
        const prioritySummary = el("div", "priority-summary");
        prioritySummary.append(el("span", "priority-count", inboxTotal), el("span", "priority-copy", inboxTotal ? "项需要你关注，项目事项已归入下方进度" : "目前没有需要你处理的事项"));
        inboxHead.append(prioritySummary);
        inboxCard.append(inboxHead);
        if (inboxTotal) {
          const items = el("div", "inbox-items");
          if (pendingApproval) {
            const approval = el("button", "inbox-item", `${pendingApproval} 条全局/Profile 待审批 →`);
            approval.type = "button";
            approval.addEventListener("click", () => openBrainFocus("approvals"));
            items.append(approval);
          }
          if (pendingSync) {
            const sync = el("button", "inbox-item", `${pendingSync} 条项目记录待同步 →`);
            sync.type = "button";
            sync.addEventListener("click", () => openBrainFocus("sync"));
            items.append(sync);
          }
          if (invalidProjects.length) {
            const invalid = el("button", "inbox-item error", `${invalidProjects.length} 个项目无法连接 →`);
            invalid.type = "button";
            invalid.addEventListener("click", () => selectProject(invalidProjects[0].project_id));
            items.append(invalid);
          }
          inboxCard.append(items);
        }
        content.append(inboxCard);

        const operationSection = el("section", "harness-operations");
        const operationHead = el("div", "operation-head");
        const operationTitle = el("div", "");
        operationTitle.append(el("h2", "", "Harness 操作"));
        operationTitle.append(el("p", "section-help", "先看影响再确认；执行由本机固定脚本完成，不交给 AI 自由发挥。"));
        operationHead.append(operationTitle);
        operationSection.append(operationHead);
        const activeOperation = state.operations?.active;
        if (activeOperation) {
          const active = el("div", "operation-active");
          active.dataset.status = activeOperation.status || "queued";
          active.append(
            el("span", "operation-status", operationStatusLabel(activeOperation.status)),
            el("span", "", `${activeOperation.label} · ${activeOperation.target}`),
            el("span", "muted", formattedTime(activeOperation.updated_at))
          );
          operationSection.append(active);
        }
        const catalog = state.operations?.catalog?.length ? state.operations.catalog : OPERATION_FALLBACKS;
        [["system", "本机与项目"], ["command", "通用命令"]].forEach(([group, label]) => {
          const groupItems = catalog.filter(item => (item.group || "system") === group);
          if (!groupItems.length) return;
          operationSection.append(el("h3", "operation-group-title", label));
          const operationGrid = el("div", "operation-grid");
          operationGrid.dataset.group = group;
          groupItems.forEach(item => {
            const button = el("button", "operation-action");
            button.type = "button";
            button.disabled = Boolean(activeOperation);
            button.append(el("strong", "", item.label), el("span", "", item.description));
            button.addEventListener("click", () => startHarnessOperation(item));
            operationGrid.append(button);
          });
          operationSection.append(operationGrid);
        });
        const historyItems = (state.operations?.items || []).filter(item => ["succeeded", "blocked", "cancelled", "failed"].includes(item.status)).slice(0, 5);
        const history = el("details", "operation-history");
        history.append(el("summary", "", `最近操作${historyItems.length ? ` · ${historyItems.length}` : ""}`));
        const historyList = el("div", "operation-history-list");
        if (!historyItems.length) {
          historyList.append(el("span", "muted", "尚无已完成操作。"));
        } else {
          historyItems.forEach(item => {
            const row = el("div", "operation-history-row");
            row.append(
              el("span", "", item.label),
              el("span", "muted", item.summary || item.target),
              el("span", item.status === "failed" ? "error" : item.status === "succeeded" ? "success" : "muted", operationStatusLabel(item.status))
            );
            const inspect = el("button", "operation-result-action", "查看结果");
            inspect.type = "button";
            inspect.addEventListener("click", () => showOperationResult(item));
            row.append(inspect);
            historyList.append(row);
          });
        }
        history.append(historyList);
        operationSection.append(history);
        content.append(operationSection);

      function visibleTasks() {
        return Object.values(state.snapshot.tasks || {})
          .filter(task => task.status !== "abandoned")
          .sort((left, right) => {
            const leftValue = Number(left.task_id.replace(/^task-/, ""));
            const rightValue = Number(right.task_id.replace(/^task-/, ""));
            if (Number.isFinite(leftValue) && Number.isFinite(rightValue)) return leftValue - rightValue;
            return (left.derived_from_sequence || 0) - (right.derived_from_sequence || 0);
          });
      }

      function activeBlocksFor(taskId = null) {
        return Object.values(state.snapshot.blocks || {}).filter(block => {
          if (!block.active) return false;
          return taskId ? block.task_id === taskId : true;
        });
      }

      function officeRoleId(value) {
        return { PM: "PM", Planner: "PM", Orchestrator: "PM", Designer: "Designer", Executor: "Executor", QA: "QA", Reviewer: "Reviewer" }[value] || null;
      }

      function officeStatusLabel(value) {
        return { active: "当前负责", waiting: "等待接手", completed: "已交付", missing: "未独立验收", idle: "尚未参与" }[value] || value || "尚未参与";
      }

      function renderRoleJelly(role) {

      const requirementProcessRoles = ["PM", "Reviewer", "Executor", "QA"];
      const requirementOfficeRoleOrder = ["PM", "Reviewer", "Designer", "Executor", "QA"];

      function requirementRoleStatus(requirement, roleId) {
        const progress = (requirement?.role_path || []).find(item => item.role === roleId);
        if (requirement?.current_work?.role === roleId) return "active";
        if (requirement?.current_role === roleId) return progress?.status === "active" ? "active" : "waiting";
        return progress ? (progress.status === "active" ? "active" : "completed") : "idle";
      }

      function renderRequirementSquad(requirement) {
        const squad = el("span", "requirement-squad");
        const actualRoles = new Set((requirement?.role_path || []).map(item => item.role));
        const roles = [...requirementProcessRoles];
        if (actualRoles.has("Designer") || requirement?.current_role === "Designer") roles.splice(2, 0, "Designer");
        roles.forEach((roleId, index) => {
          if (index) squad.append(el("span", "mini-role-arrow", "→"));
          const role = el("span", "mini-role");
          role.dataset.role = roleId;
          role.dataset.status = requirementRoleStatus(requirement, roleId);
          const avatar = el("span", "mini-role-avatar");
          avatar.append(el("span", "mini-role-task"));
          role.append(avatar, el("span", "", roleLabel(roleId)));
          squad.append(role);

        const release = el("span", "mini-release", requirement?.effective_status === "completed" ? "已完成" : "待发布");

          ? "completed"
          : ["release_ready", "release_review"].includes(requirement?.workflow?.stage) ? "ready" : "pending";
        squad.append(release);

      function currentVersion() {
        const versions = state.workspace?.versions?.items || [];
        return versions.find(item => item.status === "in_progress")
          || versions.find(item => item.status === "planned")
          || versions[0]
          || null;
      }

      function requirementTitle(requirementId, fallback = "") {
        const versionRequirement = state.workspace?.current_version?.requirements?.find(
          (item) => item.requirement_id === requirementId,
        );
        return versionRequirement?.title
          || state.snapshot.tasks?.[requirementId]?.title
          || fallback
          || requirementId
          || "未关联需求";
      }

      function decisionsForRole(role, requirementIds) {
        return Object.values(state.snapshot.decisions || {})
          .filter(item => officeRoleId(item.role) === role.role_id || requirementIds.has(item.requirement_id || item.task_id))
          .sort((left, right) => (right.derived_from_sequence || 0) - (left.derived_from_sequence || 0));
      }

        title.append(status); card.append(title);

        const rounds = (role.work_rounds || []).slice().sort((left, right) => (right.derived_from_sequence || 0) - (left.derived_from_sequence || 0));
        const historyItems = role.history || rounds.map(item => ({
          ...item,
          sequence: item.derived_from_sequence,
          artifacts: item.artifact_refs || [],
          verification_refs: item.verification_refs || []
        }));
        const scopedRequirementId = role.scope_requirement_id || null;
        const currentTransition = role.scope_transition || state.workspace?.organization?.current_transition;
        if (role.status === "waiting" && currentTransition?.to_role === role.role_id) {
          card.append(el("p", "section-help", `${roleLabel(currentTransition.from_role)} 已完成上一段工作，正在等待 ${role.label} 接手。`));

          card.append(el("p", "section-help", role.latest_summary || "当前门禁正在等待这个角色接手。"));
        } else {
          card.append(el("p", "section-help", "这个角色尚未参与当前项目的已回写工作。"));
        }

        const requirementMap = new Map();
        rounds.forEach(item => {
          const id = item.requirement_id || item.task_id;
          if (id && !requirementMap.has(id)) requirementMap.set(id, item.objective || item.summary);
        });
        Object.values(state.snapshot.decisions || {}).forEach(item => {
          const id = item.requirement_id || item.task_id;
          if (scopedRequirementId && id !== scopedRequirementId) return;
          if (id && officeRoleId(item.role) === role.role_id && !requirementMap.has(id)) requirementMap.set(id, item.title);
        });
        const requirementIds = new Set(requirementMap.keys());
        const decisions = decisionsForRole(role, requirementIds);

        const context = el("div", "detail-section");

        const artifacts = (state.workspace?.artifacts || []).filter(item => {

          return officeRoleId(item.role) === role.role_id || (item.requirement_id && requirementIds.has(item.requirement_id));

        const counts = version?.counts || { completed: 0, in_progress: 0, planned: 0, blocked: 0 };
        const completed = counts.completed || 0;

          || versionRequirements.find(item => item.effective_status === "in_progress" || item.effective_status === "blocked")
          || versionRequirements[0]
          || null;
        const acceptedRolePath = selectedRequirement?.role_path || [];
        const acceptedLastRole = acceptedRolePath[acceptedRolePath.length - 1]?.role || null;
        const workflowTransitions = selectedRequirement?.workflow && selectedRequirement.current_role && acceptedLastRole && acceptedLastRole !== selectedRequirement.current_role
          ? [{
              kind: selectedRequirement.current_role === "QA" ? "quality_gate" : "requirement_gate",
              from_role: acceptedLastRole,
              to_role: selectedRequirement.current_role,
              status: "pending",
              summary: selectedRequirement.workflow.gate_reason,
              requirement_id: selectedRequirement.requirement_id,

          selectedRequirement?.workflow

        const transition = selectedTransitions[selectedTransitions.length - 1] || null;
        const currentRole = selectedRequirement?.current_role || null;
        const blockCount = versionRequirements.reduce((total, item) => total + (item.blocks || []).length, 0);
        const nextStep = selectedRequirement?.next_step || "等待 PM 规划";

      function resolveArtifactLink(documentPath, href) {
        const clean = String(href).split("#", 1)[0].split("?", 1)[0];
        if (!clean || clean.startsWith("/") || /^[a-z][a-z0-9+.-]*:/i.test(clean)) return null;
        const parts = String(documentPath || "").split("/").slice(0, -1);
        for (const segment of clean.split("/")) {
          if (!segment || segment === ".") continue;
          if (segment === "..") {
            if (!parts.length) return null;
            parts.pop();
          } else {
            parts.push(segment);
          }
        }
        return parts.join("/");
      }

      function appendInlineMarkdown(parent, value, documentPath = "") {
        const source = String(value);
        const tokenPattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_|\[[^\]\n]+\]\([^)\s]+(?:\s+"[^"\n]*")?\))/g;
        let offset = 0;
        for (const match of source.matchAll(tokenPattern)) {
          if (match.index > offset) parent.append(document.createTextNode(source.slice(offset, match.index)));
          const token = match[0];
          if (token.startsWith("`") && token.endsWith("`")) {
            parent.append(el("code", "", token.slice(1, -1)));
          } else if ((token.startsWith("**") && token.endsWith("**")) || (token.startsWith("__") && token.endsWith("__"))) {
            parent.append(el("strong", "", token.slice(2, -2)));
          } else if ((token.startsWith("*") && token.endsWith("*")) || (token.startsWith("_") && token.endsWith("_"))) {
            parent.append(el("em", "", token.slice(1, -1)));
          } else {
            const link = token.match(/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)$/);
            const anchor = el("a", "", link[1]);
            if (link[3]) anchor.title = link[3];
            if (/^https?:\/\//i.test(link[2]) || /^mailto:/i.test(link[2])) {
              anchor.href = link[2];
              anchor.target = "_blank";
              anchor.rel = "noopener noreferrer";
            } else {
              const artifactPath = resolveArtifactLink(documentPath, link[2]);
              const readable = artifactPath && (state.workspace?.artifacts || []).some(item => item.path === artifactPath);
              anchor.href = readable ? "#" : link[2].startsWith("#") ? link[2] : "#";
              if (readable) {
                anchor.addEventListener("click", event => { event.preventDefault(); openArtifact(artifactPath); });
              } else if (!link[2].startsWith("#")) {
                anchor.addEventListener("click", event => event.preventDefault());
                anchor.title = anchor.title || "该链接未登记为可读产物";
              }
            }
            parent.append(anchor);
          }
          offset = match.index + token.length;
        }
        if (offset < source.length) parent.append(document.createTextNode(source.slice(offset)));
      }

      function codeDetails(title, value, language = "text", open = true) {
        const details = el("details", "code-fold");
        details.open = open;
        details.append(el("summary", "", `${title} · ${language || "text"} · ${String(value).split("\n").length} 行`));
        const scroll = el("div", "code-scroll");
        String(value).split("\n").forEach((line, index) => {
          const row = el("div", "code-line");
          row.append(el("span", "line-number", index + 1), el("code", "", line || " "));
          scroll.append(row);
        });
        details.append(scroll);
        return details;
      }

      function renderCodeDocument(container, documentValue) {
        const reader = el("section", "document-reader");
        reader.append(el("div", "eyebrow", "代码产物"));
        reader.append(el("h2", "", documentValue.title || documentValue.name));
        if (documentValue.summary) reader.append(el("p", "section-help", documentValue.summary));
        reader.append(codeDetails(documentValue.path, documentValue.content, documentValue.language, true));

      }

      function markdownCells(value) {
        return value.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(item => item.trim());
      }

      function isMarkdownTableSeparator(value) {
        return markdownCells(value).every(item => /^:?-{3,}:?$/.test(item));
      }

      function scrollToDocumentHeading(headingId) {
        const target = document.getElementById(headingId);
        if (!target) return;
        document.querySelectorAll(".document-reader [data-stage-active]").forEach(node => delete node.dataset.stageActive);
        target.dataset.stageActive = "true";
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderArtifactStageNavigation(container, headings, stages) {
        container.append(el("div", "document-outline-title", "阶段导航"));
        const stageList = el("div", "stage-list");
        stages.forEach(stage => {
          const heading = headings.find(item => item.line === stage.line);
          if (!heading) return;

          meta.append(el("span", "stage-format", stage.traceable ? "规范标题" : "旧格式"));
