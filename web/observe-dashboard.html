      function renderDocumentOutline(container, headings, stages) {
        const outline = el("nav", "document-outline");
        outline.setAttribute("aria-label", "文档目录");
        renderArtifactStageNavigation(outline, headings, stages);
        outline.append(el("div", "document-outline-title", "完整文档目录"));
        headings.forEach(item => {
          const button = el("button", "outline-link", item.text);
          button.type = "button";
          button.dataset.level = item.level;
          button.addEventListener("click", () => scrollToDocumentHeading(item.id));
          outline.append(button);
        });
        if (!headings.length) outline.append(el("div", "muted", "这个 Markdown 没有可导航标题。"));
        container.append(outline);
      }

      function markdownHeadingId(value, index, usedIds) {
        const base = String(value).toLowerCase().replace(/[`*_]/g, "").trim().replace(/\s+/g, "-").replace(/[^a-z0-9\u3400-\u9fff-]/g, "") || `section-${index + 1}`;
        let candidate = base;
        let suffix = 2;
        while (usedIds.has(candidate)) { candidate = `${base}-${suffix}`; suffix += 1; }
        usedIds.add(candidate);
        return candidate;
      }

      function renderMarkdownDocument(container, documentValue) {
        const shell = el("div", "markdown-shell");
        const reader = el("article", "document-reader");
        reader.append(el("div", "eyebrow", "Markdown 阅读"));
        const lines = String(documentValue.content).replace(/\r\n?/g, "\n").split("\n");
        const headings = [];
        const usedIds = new Set();
        let index = 0;
        while (index < lines.length) {
          const line = lines[index];
          if (!line.trim()) { index += 1; continue; }
          const fence = line.match(/^```\s*([^\s]*)/);
          if (fence) {
            const codeLines = [];
            index += 1;
            while (index < lines.length && !/^```/.test(lines[index])) {
              codeLines.push(lines[index]); index += 1;
            }
            index += 1;
            reader.append(codeDetails("代码块", codeLines.join("\n"), fence[1] || "text", false));
            continue;
          }
          const heading = line.match(/^(#{1,4})\s+(.+)/);
          if (heading) {
            const node = el(`h${heading[1].length}`, "");
            const headingId = markdownHeadingId(heading[2], headings.length, usedIds);
            node.id = headingId;
            headings.push({ id: headingId, line: index + 1, level: heading[1].length, text: heading[2].replace(/[`*_]/g, "") });
            appendInlineMarkdown(node, heading[2], documentValue.path); reader.append(node); index += 1; continue;
          }
          if (/^(---+|\*\*\*+)\s*$/.test(line)) { reader.append(el("hr", "")); index += 1; continue; }
          if (line.trim().startsWith("|") && index + 1 < lines.length && isMarkdownTableSeparator(lines[index + 1])) {
            const wrap = el("div", "table-wrap");
            const table = el("table", "");
            const head = el("thead", "");
            const headRow = el("tr", "");
            markdownCells(line).forEach(cell => { const th = el("th", ""); appendInlineMarkdown(th, cell, documentValue.path); headRow.append(th); });
            head.append(headRow); table.append(head); index += 2;
            const body = el("tbody", "");
            while (index < lines.length && lines[index].trim().startsWith("|")) {
              const row = el("tr", "");
              markdownCells(lines[index]).forEach(cell => { const td = el("td", ""); appendInlineMarkdown(td, cell, documentValue.path); row.append(td); });
              body.append(row); index += 1;
            }
            table.append(body); wrap.append(table); reader.append(wrap); continue;
          }
          const listMatch = line.match(/^\s*([-*+] |\d+[.)] )(.+)/);
          if (listMatch) {
            const ordered = /^\d/.test(listMatch[1]);
            const list = el(ordered ? "ol" : "ul", "");
            while (index < lines.length) {
              const current = lines[index].match(/^\s*([-*+] |\d+[.)] )(.+)/);
              if (!current || /^\d/.test(current[1]) !== ordered) break;
              const item = el("li", ""); appendInlineMarkdown(item, current[2], documentValue.path); list.append(item); index += 1;
            }
            reader.append(list); continue;
          }
          if (line.startsWith(">")) {
            const quote = el("blockquote", "");
            const quoteLines = [];
            while (index < lines.length && lines[index].startsWith(">")) {
              quoteLines.push(lines[index].replace(/^>\s?/, "")); index += 1;
            }
            appendInlineMarkdown(quote, quoteLines.join("\n"), documentValue.path); reader.append(quote); continue;
          }
          const paragraphLines = [line.trim()];
          index += 1;
          while (index < lines.length && lines[index].trim() && !/^(#{1,4})\s+|^```|^\s*([-*+] |\d+[.)] )|^>/.test(lines[index])) {
            if (lines[index].trim().startsWith("|") && index + 1 < lines.length && isMarkdownTableSeparator(lines[index + 1])) break;
            paragraphLines.push(lines[index].trim()); index += 1;
          }
          const paragraph = el("p", ""); appendInlineMarkdown(paragraph, paragraphLines.join(" "), documentValue.path); reader.append(paragraph);
        }
        renderDocumentOutline(shell, headings, documentValue.stages || []);
        shell.append(reader);
        container.append(shell);
      }

      async function loadArtifact(pathValue) {
        state.artifactPath = pathValue;
        state.artifactDocument = null;
        state.artifactError = null;
        writeUrlState();
        render();
        try {
          const query = new URLSearchParams({ path: pathValue, run: state.run?.run_id || "" });
          state.artifactDocument = await fetchJson(`/api/projects/${encodeURIComponent(state.project.project_id)}/artifact?${query.toString()}`);
        } catch (error) {
          state.artifactError = error.message;
        }
        render();
      }

      function openArtifact(pathValue) {
        state.view = "artifacts";
        return loadArtifact(pathValue);
      }

      function renderArtifacts(root) {
        const layout = el("div", "artifact-layout");
        const listCard = el("section", "section-card");
        listCard.append(el("h2", "", "产物"), el("p", "section-help", "选择一份文件，再查看它内部的阶段记录。"));
        const list = el("div", "artifact-list");
        const artifacts = (state.workspace?.artifacts || []).slice()
          .sort((left, right) => String(right.latest_recorded_at || right.modified_at || "").localeCompare(String(left.latest_recorded_at || left.modified_at || "")));
        artifacts.forEach(item => {
          const button = el("button", "artifact-item");
          button.type = "button";
          button.disabled = item.viewable === false;
          button.setAttribute("aria-pressed", String(state.artifactPath === item.path));
          button.append(el("span", "run-name", item.title || item.name || item.path));
          button.append(el("span", "artifact-kind", item.viewable === false ? `无法阅读 · ${item.reason || "文件不可用"}` : `${item.kind === "markdown" ? "Markdown" : item.language || "文本"} · ${item.path}`));
          button.addEventListener("click", () => loadArtifact(item.path));
          list.append(button);
        });
        if (!list.childElementCount) list.append(el("div", "empty", "还没有已登记产物。"));
        listCard.append(list); layout.append(listCard);
        const viewer = el("section", "artifact-viewer");
        if (state.artifactError) {
          const errorCard = el("section", "document-reader");
          errorCard.append(el("h2", "", "无法读取该产物"), el("p", "error", state.artifactError));
          viewer.append(errorCard);
        } else if (state.artifactPath && !state.artifactDocument) {
          viewer.append(el("div", "empty", "正在读取产物…"));
        } else if (!state.artifactDocument) {
          viewer.append(el("div", "empty", "从左侧选择一个 Markdown 或代码产物。"));
        } else if (state.artifactDocument.kind === "markdown") {
          renderMarkdownDocument(viewer, state.artifactDocument);
        } else {
          renderCodeDocument(viewer, state.artifactDocument);
        }
        layout.append(viewer); root.append(layout);
      }

      function versionStatusLabel(value) {
        return { released: "已发布", completed: "已交付", in_progress: "开发中", planned: "计划中", paused: "已暂停" }[value] || value || "未标记";
      }

      function renderVersions(root) {
        const workspaceValue = state.workspace || {};
        const versions = workspaceValue.versions || { items: [], unassigned_requirements: [] };
        const git = workspaceValue.git || { available: false, branches: [], tags: [] };
        const heading = el("section", "goal-card");
        heading.append(el("div", "goal-label", "PM 版本工作台"));
        heading.append(el("p", "goal-text", "先看每个版本要交付什么，再对照真实 Git 分支和标签。"));
        root.append(heading);

        const gitCard = el("section", "section-card");
        gitCard.append(el("h2", "", "版本与 Git 关系"));
        gitCard.append(el("p", "section-help", "一个仓库可以同时有多个已检出工作区；版本分别关联集成目标和工作分支，不代表 Agent 一定在线。"));
        if (!git.available) {
          gitCard.append(el("div", "empty", "这个项目不是 Git 仓库，无法建立版本与分支关系。"));
        } else {
          const map = el("div", "git-map");
          const repositoryNode = el("div", "git-workspace-node");
          repositoryNode.append(el("span", "git-node-label", "同一仓库"));
          repositoryNode.append(el("span", "git-node-title", git.repository_path || state.project?.path || "当前项目仓库"));
          repositoryNode.append(el("span", "git-node-meta", `${(git.worktrees || []).length || 1} 个已检出工作区 · ${git.repository_id || "仓库身份待识别"}`));
          const worktreeList = el("div", "git-worktrees");
          (git.worktrees || []).forEach(worktree => {
            const node = el("div", "git-worktree");
            node.dataset.current = String(Boolean(worktree.current));
            node.append(el("span", "git-node-label", worktree.current ? "当前查看的工作区" : worktree.primary ? "主工作区" : "已检出工作区"));
            node.append(el("span", "git-node-title", worktree.branch ? `${worktree.current ? "当前分支" : "分支"} · ${worktree.branch}` : "分离 HEAD"));
            const dirty = el("span", "git-node-meta", worktree.clean === null ? "状态不可读取" : worktree.clean ? "没有待提交改动" : `${worktree.dirty_count} 处待提交改动`);
            dirty.dataset.dirty = String(worktree.clean === false);
            node.append(dirty);
            node.append(el("span", "git-node-meta", worktree.path));
            worktreeList.append(node);
          });
          if (!worktreeList.childElementCount) {
            const node = el("div", "git-worktree");
            node.dataset.current = "true";
            node.append(el("span", "git-node-label", "当前查看的工作区"));
            node.append(el("span", "git-node-title", git.current_branch ? `当前分支 · ${git.current_branch}` : "分离 HEAD"));
            node.append(el("span", "git-node-meta", git.clean ? "没有待提交改动" : `${git.dirty_count} 处待提交改动`));
            worktreeList.append(node);
          }
          repositoryNode.append(worktreeList);
          map.append(repositoryNode, el("div", "git-trunk"));

          const grouped = new Map();
          const addVersionRelation = (branchName, version, relation) => {
            const normalized = branchName || "未分配分支";
            if (!grouped.has(normalized)) grouped.set(normalized, []);
            grouped.get(normalized).push({ version, relation });
          };
          (versions.items || []).forEach(version => {
            addVersionRelation(version.branch, version, "integration");
            (version.work_branches || []).forEach(branchName => addVersionRelation(branchName, version, "work"));
          });
          (git.branches || []).forEach(branch => {
            if (!grouped.has(branch.name)) grouped.set(branch.name, []);
          });
          const branches = el("div", "git-branches");
          [...grouped.entries()].sort(([left], [right]) => {
            if (left === git.current_branch) return -1;
            if (right === git.current_branch) return 1;
            const leftCheckedOut = (git.branches || []).find(item => item.name === left)?.checked_out_in?.length || 0;
            const rightCheckedOut = (git.branches || []).find(item => item.name === right)?.checked_out_in?.length || 0;
            if (leftCheckedOut !== rightCheckedOut) return rightCheckedOut - leftCheckedOut;
            if (left === "未分配分支") return 1;
            if (right === "未分配分支") return -1;
            return left.localeCompare(right);
          }).forEach(([branchName, branchRelations]) => {
            const branch = (git.branches || []).find(item => item.name === branchName);
            const checkedOutCount = branch?.checked_out_in?.length || 0;
            const isIntegrationTarget = branchRelations.some(item => item.relation === "integration");
            const isWorkBranch = branchRelations.some(item => item.relation === "work");
            const row = el("div", "git-branch-row");
            const branchNode = el("div", "git-branch-node");
            branchNode.dataset.current = String(branchName === git.current_branch);
            branchNode.append(el("span", "git-node-label", isWorkBranch ? "工作分支" : isIntegrationTarget ? "集成目标" : branchName === git.current_branch ? "当前分支" : "分支"));
            branchNode.append(el("span", "git-node-title", branchName));
            branchNode.append(el("span", "git-node-meta", branchName === "未分配分支" ? "版本计划尚未指定" : checkedOutCount ? `已检出 · ${checkedOutCount} 个工作区` : branch ? "未检出 · 本地分支" : "计划中，尚未创建"));
            const versionLane = el("div", "git-version-lane");
            branchRelations.forEach(({ version, relation }) => {
              const node = el("div", "git-version-node");
              node.dataset.status = version.status;
              node.append(el("span", "", `v${version.version} · ${versionStatusLabel(version.status)} · ${relation === "work" ? "工作分支" : "集成目标"}`));
              node.append(el("span", "git-version-tag", version.tag ? `发布标签 · ${version.tag}${version.tag_exists ? "" : "（尚未发布）"}` : "发布标签 · 未设置"));
              versionLane.append(node);
            });
            if (!branchRelations.length) versionLane.append(el("span", "muted", "尚未关联版本"));
            row.append(branchNode, versionLane); branches.append(row);
          });
          if (!branches.childElementCount) branches.append(el("div", "empty", "还没有分支或版本记录。"));
          map.append(branches); gitCard.append(map);
        }
        root.append(gitCard);

        const main = el("div", "version-stack");
        const planCard = el("section", "section-card");
        planCard.append(el("h2", "", "版本需求"), el("p", "section-help", versions.source ? `最新版本优先 · 来自 ${versions.source}` : "尚未建立 docs/VERSIONS.md，PM 还没有把需求分配到版本。"));
        const stack = el("div", "version-stack");
        (versions.items || []).forEach(version => {
          const card = el("article", "version-card");
          card.dataset.status = version.status;
          const head = el("div", "version-head");
          head.append(el("h3", "version-title", `v${version.version}`), el("span", "status", versionStatusLabel(version.status)));
          card.append(head);
          if (version.goal) card.append(el("p", "", version.goal));
          const chips = el("div", "chip-row");
          if (version.branch) {
            const branchChip = el("span", "version-chip", `集成目标 ${version.branch}${version.branch_exists ? "" : " · 未创建"}`);
            branchChip.dataset.ok = String(version.branch_exists);
            chips.append(branchChip);
          }
          (version.work_branch_states || []).forEach(workBranch => {
            const suffix = workBranch.checked_out ? " · 已检出" : workBranch.exists ? " · 未检出" : " · 未创建";
            const branchChip = el("span", "version-chip", `工作分支 ${workBranch.name}${suffix}`);
            branchChip.dataset.ok = String(workBranch.exists);
            chips.append(branchChip);
          });
          if (version.tag) {
            const tagChip = el("span", "version-chip", `标签 ${version.tag}${version.tag_exists ? "" : " · 尚未发布"}`);
            tagChip.dataset.ok = String(version.tag_exists);
            chips.append(tagChip);
          }
          card.append(chips);
          if (version.branch_mismatch) card.append(el("p", "warning-line", `版本计划指向 ${version.branch}，但当前实际在 ${git.current_branch} 开发。`));
          const requirements = el("div", "version-requirements");
          (version.requirements || []).forEach(requirement => {
            const row = el("div", "version-requirement");
            row.append(el("span", "", requirement.status === "completed" ? "✓" : "○"));
            row.append(el("span", "", requirement.title));
            const planStatus = el("span", "muted", statusLabel(requirement.status));
            if (requirement.observed_status && requirement.observed_status !== requirement.status) {
              planStatus.title = `实时任务状态：${statusLabel(requirement.observed_status)}`;
            }
            row.append(planStatus);
            requirements.append(row);
          });
          if (!requirements.childElementCount) requirements.append(el("div", "muted", "这个版本还没有分配需求。"));
          card.append(requirements); stack.append(card);
        });
        if (!stack.childElementCount) stack.append(el("div", "empty", "PM 还没有建立版本路线。"));
        planCard.append(stack); main.append(planCard);
        if ((versions.unassigned_requirements || []).length) {
          const unassigned = el("section", "section-card");
          unassigned.append(el("h2", "", "尚未安排版本"), el("p", "section-help", "这些需求在 Plan 中存在，但还没有进入任何版本。"));
          (versions.unassigned_requirements || []).forEach(item => unassigned.append(el("div", "attention-item", `${item.requirement_id} · ${item.title}`)));
          main.append(unassigned);
        }
        root.append(main);
      }

      function renderTimeline(panel) {
        if (!state.events.length) {
          panel.append(el("div", "empty", "当前 run 没有事件。"));
          return;
        }
        const timeline = el("div", "timeline");
        state.events.slice().reverse().forEach(event => {
          const row = el("article", "event-row");
          row.append(el("div", "sequence", `#${event.sequence}`));
          row.append(el("time", "event-time", new Date(event.occurred_at).toLocaleString()));
          const body = el("div", "");
          body.append(el("div", "event-title", `${event.source.role || event.source.producer} · ${event.type}`));
          body.append(el("div", "event-summary", summaryForEvent(event)));
          row.append(body);
          timeline.append(row);
        });
        panel.append(timeline);
      }

      function renderEvents(panel) {
        if (!state.events.length) {
          panel.append(el("div", "empty", "当前 run 没有事件。"));
          return;
        }
        const wrap = el("div", "table-wrap");
        const table = el("table", "");
        const caption = el("caption", "sr-only", "Append-only 运行事件");
        table.append(caption);
        const head = el("thead", "");
        const headRow = el("tr", "");
        ["Seq", "时间", "类型", "Producer", "Subject", "观察", "摘要"].forEach(label => headRow.append(el("th", "", label)));
        head.append(headRow); table.append(head);
        const body = el("tbody", "");
        state.events.slice().reverse().forEach(event => {
          const row = el("tr", "");
          row.append(el("td", "", event.sequence));
          row.append(el("td", "muted", new Date(event.occurred_at).toLocaleString()));
          row.append(el("td", "", event.type));
          row.append(el("td", "", event.source.role || event.source.producer));
          row.append(el("td", "", `${event.subject.kind}:${event.subject.id}`));
          row.append(el("td", "", event.observation_kind === "inferred" ? `推断 ${event.confidence ?? ""}` : "事实"));
          row.append(el("td", "", summaryForEvent(event)));
          body.append(row);
        });
        table.append(body); wrap.append(table); panel.append(wrap);
      }

      function matchingForTask(collection, taskId) {
        return Object.values(collection || {}).filter(item => item.task_id === taskId);
      }

      function renderDetail(container) {
        const detail = el("aside", "detail");
        detail.setAttribute("aria-label", "任务详情");
        const selectedTask = state.taskId ? state.snapshot.tasks?.[state.taskId] : null;
        const task = selectedTask?.status === "abandoned" ? null : selectedTask;
        if (!task) {
          detail.append(el("h2", "", "任务详情"), el("p", "muted", "选择一个任务查看产物、验证、阻塞和来源。"));
          container.append(detail);
          return;
        }
        detail.append(el("h2", "", task.title));
        const status = el("span", "status", `${task.role || "Unknown"} · ${statusLabel(task.status)}`);
        status.dataset.status = task.status;
        detail.append(status);
        detail.append(el("h3", "", "依赖"));
        detail.append(el("p", "", (task.depends_on || []).join(", ") || "无显式依赖"));
        detail.append(el("h3", "", "验证"));
        const verifications = (state.snapshot.verifications || []).filter(item => item.task_id === task.task_id);
        if (verifications.length) verifications.forEach(item => detail.append(el("p", "", `${item.result}: ${item.summary || item.check}`)));
        else detail.append(el("p", "muted", "没有验证证据"));
        detail.append(el("h3", "", "阻塞"));
        const blocks = matchingForTask(state.snapshot.blocks, task.task_id).filter(item => item.active);
        if (blocks.length) blocks.forEach(item => detail.append(el("p", "error", item.summary)));
        else detail.append(el("p", "muted", "没有 active block"));
        detail.append(el("h3", "", "来源"));
        detail.append(el("p", "", `sequence ${task.derived_from_sequence || "unknown"}`));
        container.append(detail);
      }

      function render() {
        renderNavTree();
        const isGlobalView = ["workbench", "settings"].includes(state.view);
        if (!state.project || isGlobalView) {
          content.replaceChildren();
          if (state.view === "settings") renderSettings();
          else renderPortfolio();
          return;
        }
        content.replaceChildren();
        if (state.project.validation !== "valid") {
          const box = el("div", "empty error", `${state.project.name} 当前不可监控`);
          box.append(el("div", "event-summary", state.project.reason || state.project.validation));
          box.append(el("div", "project-path", state.project.path));
          content.append(box);
          return;
        }
        if (!state.snapshot) {
          content.append(el("div", "empty", "正在读取项目快照…"));
          return;
        }
        renderHeader(content);
        if (state.view === "overview") {
          renderOverview(content);
          return;
        }
        if (state.view === "artifacts") {
          renderArtifacts(content);
          return;
        }
        if (state.view === "versions") {
          renderVersions(content);
          return;
        }
        const workspace = el("div", "workspace");
        const panel = el("section", "panel");
        panel.setAttribute("role", "tabpanel");
        if (state.view === "timeline") renderTimeline(panel);
        else if (state.view === "events") renderEvents(panel);
        else if (state.view === "agents") renderAgents(panel);
        else if (state.view === "runs") renderRuns(panel);
        workspace.append(panel);
        renderDetail(workspace);
        content.append(workspace);
      }

      async function selectRun(runId) {
        state.run = state.index.runs.find(item => item.run_id === runId) || state.index.runs[0];
        if (!state.run) return;
        const [snapshot, events] = await Promise.all([
          fetchJson(`/api/projects/${encodeURIComponent(state.project.project_id)}/runs/${encodeURIComponent(state.run.run_id)}/snapshot.json`),
          fetchEvents(state.project.project_id, state.run.run_id)
        ]);
        state.snapshot = snapshot;
        state.events = events;
        const currentRequirements = state.workspace?.current_version?.requirements || [];
        const currentRequirementIds = new Set(currentRequirements.map(item => item.requirement_id));
        const taskIsCurrentRequirement = currentRequirementIds.has(state.taskId);
        const snapshotTask = state.taskId ? snapshot.tasks?.[state.taskId] : null;
        if (
          state.taskId
          && (
            (state.view === "overview" && currentRequirements.length && !taskIsCurrentRequirement)
            || (!taskIsCurrentRequirement && (!snapshotTask || snapshotTask.status === "abandoned"))
          )
        ) {
          state.taskId = null;
        }
        if (!state.taskId && state.view === "overview" && currentRequirements.length) {
          const preferredRequirement = currentRequirements.find(item => ["in_progress", "blocked"].includes(item.effective_status))
            || currentRequirements[0];
          state.taskId = preferredRequirement.requirement_id;
        } else if (!state.taskId && snapshot.plan?.current_task_id && snapshot.tasks?.[snapshot.plan.current_task_id]) {
          state.taskId = snapshot.plan.current_task_id;
        }
        const officeRoles = state.workspace?.organization?.roles || [];
        if (state.selectedRole && !officeRoles.some(item => item.role_id === state.selectedRole)) {
          state.selectedRole = null;
        }
        writeUrlState();
        render();
      }

      async function selectProject(projectId, requestedRunId = null, preserveTask = false) {
        if (projectId) state.focus = null;
        state.project = projectId ? state.portfolio.projects.find(item => item.project_id === projectId) || null : null;
        state.index = null;
        state.run = null;
        state.snapshot = null;
        state.workspace = null;
        state.events = [];
        state.artifactDocument = null;
        state.artifactError = null;
        if (!preserveTask) {
          state.taskId = null;
          state.selectedRole = null;
          state.artifactPath = null;
        }
        if (!state.project) {
          writeUrlState();
          render();
          return;
        }
        if (["workbench", "settings"].includes(state.view)) {
          state.view = "overview";
        }
        if (state.project.validation !== "valid") {
          writeUrlState();
          render();
          return;
        }
        [state.index, state.workspace] = await Promise.all([
          fetchJson(`/api/projects/${encodeURIComponent(state.project.project_id)}/index.json`),
          fetchJson(`/api/projects/${encodeURIComponent(state.project.project_id)}/workspace.json`)
        ]);
        const selectedArtifact = (state.workspace.artifacts || []).find(item => item.path === state.artifactPath);
        if (state.artifactPath && !selectedArtifact) state.artifactPath = null;
        const runId = state.index.runs?.some(item => item.run_id === requestedRunId) ? requestedRunId : state.index.runs?.[0]?.run_id;
        if (!runId) {
          writeUrlState();
          render();
          return;
        }
        await selectRun(runId);
        if (state.view === "artifacts" && state.artifactPath) await loadArtifact(state.artifactPath);
      }

      async function load() {
        try {
          const [portfolio, agents, skills, operations, brainHealth, brainCandidates, projectMemories, harnessImprovements] = await Promise.all([
            fetchJson("/api/portfolio.json"),
            fetchJson("/api/agents.json"),
            fetchJson("/api/skills.json"),
            fetchJson("/api/operations.json"),
            fetchJson("/api/brain/status.json"),
            fetchJson("/api/brain/candidates.json"),
            fetchJson("/api/brain/project-memory.json?limit=100"),
            fetchJson("/api/harness/improvements.json")
          ]);
          state.portfolio = portfolio;
          state.agents = agents;
          state.skills = skills;
          state.operations = operations;
          state.brainHealth = brainHealth;
          state.brainCandidates = brainCandidates.items || [];
          state.projectMemories = projectMemories.items || [];
          state.harnessImprovements = harnessImprovements.items || [];
          const requested = readUrlState();
          let projectId = requested.projectId;
          if (!projectId && requested.runId) {
            projectId = state.portfolio.projects.find(project => project.runs?.some(run => run.run_id === requested.runId))?.project_id || null;
          }
          const requestedProject = projectId ? state.portfolio.projects.find(project => project.project_id === projectId) : null;
          if (requestedProject && requestedProject.validation !== "valid") {
            state.notice = `${requestedProject.name} 已失效，已回到全部项目。${requestedProject.reason ? ` ${requestedProject.reason}` : ""}`;
            projectId = null;
          } else if (projectId && !requestedProject) {
            state.notice = "URL 中的项目未登记，已回到全部项目。";
            projectId = null;
          } else {
            state.notice = null;
          }
          await selectProject(projectId, requested.runId, true);
          if (state.operations?.active) refreshOperations().catch(() => {});
        } catch (error) {
          const box = el("div", "empty error", "无法读取运行数据。");
          box.append(el("div", "event-summary", error.message));
          box.append(el("p", "muted", "请确认 Mick Harness Observer 正在 127.0.0.1:6425 运行。可执行 harness observe service status；临时模式可运行 harness observe watch --all。"));
          const retry = el("button", "retry-button", "重新连接");
          retry.type = "button";
          retry.addEventListener("click", () => {
            retry.disabled = true;
            retry.textContent = "正在重连…";
            load();
          });
          box.append(retry);
          content.replaceChildren(box);
        }
      }

      window.addEventListener("popstate", load);
      load();
    })();
  </script>
</body>
</html>
